<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content">
<title>Memo</title>
<link rel="stylesheet" href="../../external/legacy/bootstrap-5.3.3-dist/css/bootstrap.min.css">
<link rel="stylesheet" href="../../external/legacy/bootstrap-icons-1.11.3/bootstrap-icons.css">
<script src="../../external/legacy/bootstrap-5.3.3-dist/js/bootstrap.min.js" defer></script>
<style>
html,body{height:100%;}
body{ font-size:14px; }
.app-shell{ height:100vh; height:100dvh; overflow:hidden; }
#connect-screen{ height:100%; }
#memo-topbar{ padding:6px 16px; }
#currentKeyLabel{ cursor:pointer; border-bottom:1px dashed var(--bs-secondary-color); }
#currentKeyLabel:hover{ color:var(--bs-body-color); }
#memo-editor{ min-height:0; }
#editorText{ resize:none; border:none; box-shadow:none; font-size:15px; line-height:1.7; }
#editorText:focus{ box-shadow:none; }
.memo-list-item{ padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--bs-border-color); }
.memo-list-item:hover{ background:var(--bs-secondary-bg); }
.memo-list-item .memo-preview{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.memo-list-item .memo-date{ font-size:11px; color:var(--bs-secondary-color); }
.memo-new-item{ padding:12px 14px; cursor:pointer; border-bottom:1px solid var(--bs-border-color); font-weight:500; }
.memo-new-item:hover{ background:var(--bs-secondary-bg); }
.empty-state{ padding:60px 20px; }
.empty-state i{ font-size:2.2rem; margin-bottom:10px; opacity:.6; }
#connectKeysList{ max-height:160px; overflow-y:auto; border:1px solid var(--bs-border-color); border-radius:.375rem; background:var(--bs-tertiary-bg); }
.connect-key-item{ padding:6px 10px; cursor:pointer; font-size:13px; }
.connect-key-item:hover{ background:var(--bs-secondary-bg); }
.connect-key-item + .connect-key-item{ border-top:1px solid var(--bs-border-color); }
</style>
</head>
<body>

<div class="app-shell position-relative bg-body">

    <div id="connect-screen" class="d-none align-items-center justify-content-center">
        <div class="card shadow" style="width:340px;">
            <div class="card-body">
                <h5 class="card-title mb-3"><i class="bi bi-journal-text"></i> <span data-CLan="memo.connect.title">Memo</span></h5>
                <div class="mb-2">
                    <input type="text" id="connectKeyInput" class="form-control" placeholder="Key (empty = current time)" data-CLan="memo.connect.keyPlaceholder">
                </div>
                <div class="mb-3">
                    <input type="password" id="connectPwInput" class="form-control" placeholder="Password (optional, encrypts this key)" data-CLan="memo.connect.pwPlaceholder">
                </div>
                <div id="connectMsg" class="text-danger small mb-2"></div>
                <button id="connectBtn" class="btn btn-primary w-100 mb-3" data-CLan="memo.connect.go">Connect</button>
                <div id="connectKeysList"></div>
            </div>
        </div>
    </div>

    <div id="main-screen" class="d-none position-absolute flex-column overflow-hidden" style="inset:0;">
        <div id="memo-topbar" class="d-flex align-items-center gap-2 border-bottom bg-body-tertiary flex-shrink-0">
            <span class="text-body-secondary small text-truncate" id="currentKeyLabel" role="button" title="Click to rename this key (moves existing memos)" data-CLan-title="memo.key.editTitle"></span>
            <input type="text" id="currentKeyInput" class="form-control form-control-sm d-none" style="width:160px;">
            <div class="ms-auto d-flex gap-2">
                <button id="topConnectBtn" type="button" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1">
                    <i class="bi bi-box-arrow-right"></i> <span data-CLan="memo.top.connect">Connect</span>
                </button>
                <button id="topListBtn" type="button" class="btn btn-sm btn-outline-secondary d-flex align-items-center gap-1">
                    <i class="bi bi-list-ul"></i> <span data-CLan="memo.top.list">List</span>
                </button>
                <button id="topDeleteBtn" type="button" class="btn btn-sm btn-outline-danger d-flex align-items-center gap-1">
                    <i class="bi bi-trash"></i> <span data-CLan="memo.top.delete">Delete</span>
                </button>
            </div>
        </div>

        <div id="memo-editor" class="d-none flex-grow-1 overflow-hidden flex-column">
            <textarea id="editorText" class="form-control flex-grow-1 p-3" data-CLan="memo.editor.placeholder" placeholder="Write a memo..."></textarea>
            <div class="px-3 py-1 text-body-secondary small flex-shrink-0" id="saveStatus"></div>
        </div>

        <div id="memo-list" class="d-none flex-grow-1 overflow-auto">
            <div class="memo-new-item" id="memoNewItem"><i class="bi bi-plus-lg"></i> <span data-CLan="memo.list.new">New Memo</span></div>
            <div id="memoListItems"></div>
            <div id="memoListEmpty" class="empty-state text-center text-body-secondary" style="display:none;">
                <i class="bi bi-journal d-block"></i><span data-CLan="memo.list.empty">No memos yet.</span>
            </div>
        </div>
    </div>

</div>

<script type="module" src="./Memo.js"></script>
</body>
</html>
