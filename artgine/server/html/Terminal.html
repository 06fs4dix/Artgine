<style>
#mi-bar { position:fixed;bottom:0;left:0;right:0;z-index:10000;display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #444;background:#1a1a1a;box-sizing:border-box; }
#mi-bar textarea { flex:1;padding:5px 8px;background:#2a2a2a;border:1px solid #555;border-radius:4px;color:#fff;font-family:monospace;font-size:0.9rem;resize:none;line-height:1.4;max-height:200px;overflow-y:auto;min-width:0;box-sizing:border-box; }
#mi-bar textarea:focus { outline:none;border-color:#00e5a0; }
#mi-bar textarea.super, #mi-bar textarea.super:focus { border-color:#ff3b3b !important;background:#2a0e0e !important;color:#ff7a7a; }
.mi-item.super-on { color:#ff7a7a; }
#mi-dd-btn { padding:5px 12px;background:#555;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:1.2rem;white-space:nowrap;line-height:1.4; }
#mi-dd-btn:hover { background:#666; }
#mi-dd-menu { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10001;width:max-content;min-width:0;max-width:calc(100vw - 16px);list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
#mi-dd-menu.show { display:block; }
.mi-item { display:block;width:100%;padding:6px 10px;background:none;border:none;color:#ddd;text-align:left;cursor:pointer;font-size:0.9rem;white-space:nowrap;box-sizing:border-box; }
.mi-item:hover { background:#3a3a3a;color:#fff; }
.mi-sep { height:1px;background:#444;margin:4px 0;list-style:none; }
.mi-sub-wrap { position:relative; }
.mi-sub-trigger { display:flex;justify-content:space-between;align-items:center; }
.mi-submenu { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10002;width:max-content;min-width:0;max-width:calc(100vw - 16px);max-height:60vh;overflow-y:auto;list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
.mi-submenu.show { display:block; }
#mi-ac { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10002;max-height:40vh;overflow-y:auto;min-width:220px;list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
.mi-ac-item { display:block;width:100%;padding:4px 12px;background:none;border:none;color:#ddd;text-align:left;cursor:pointer;font-family:monospace;font-size:0.85rem;white-space:nowrap;box-sizing:border-box; }
.mi-ac-item:hover,.mi-ac-item.active { background:#3a3a3a;color:#fff; }
</style>
<script>
window.addEventListener('keydown', function(e) {
    if (e.key === 'Tab') {
        e.preventDefault(); e.stopPropagation();
        window.top.postMessage({ type: 'terminal-tab-key' }, '*');
    }
    if (e.key === 'F1' || e.key === 'F2' || e.key === 'F3' || e.key === 'F4' || e.key === 'F7') {
        e.preventDefault(); e.stopPropagation();
        window.top.postMessage({ type: 'home-hotkey', key: e.key }, '*');
    }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
        // 알림 전환(→)/이전 세션 복귀(←)용으로 상위에 전달만 한다(터미널 커서 이동은 막지 않음)
        window.top.postMessage({ type: 'terminal-arrow-key', key: e.key }, '*');
    }
    if (e.ctrlKey && e.key === 't') {
        e.preventDefault(); e.stopPropagation();
        var vp = document.querySelector('.xterm-viewport');
        if (vp) vp.scrollTop = vp.scrollHeight;
    }
}, true);

(function(){
    var _enc = new TextEncoder();
    var _W = window.WebSocket;
    var _wsRef = null;

    // 토큰 저장/마이그레이션 로직은 CAuthToken.ts(artgine/server/CAuthToken.ts)가 유일한 소스다.
    // 이 인라인 스크립트는 type="module"이 될 수 없어(아래 WebSocket 몽키패치가 ttyd 본문 스크립트보다
    // 먼저 동기 실행돼야 함 — module은 defer 취급되어 너무 늦게 실행됨) 동적 import()로 그 모듈만 불러와 쓴다.
    // 키 문자열(CPath.WebRootUrl()과 동일한 "origin + 첫 경로 세그먼트")만 여기서 직접 계산한다
    // — CPath.js를 불러오면 CUtil/LZ 등 부수 의존성이 줄줄이 따라오기 때문.
    function _webRootUrl() {
        var seg = window.location.pathname.split('/')[1] || '';
        return window.location.protocol + '//' + window.location.host + '/' + seg + '/';
    }
    // artgine/ 폴더는 작업 디렉토리(WorkingPath) 바로 아래가 아니라 한 단계 더 들어간 구조
    // (예: Artgine/artgine)일 수 있어, pathname의 첫 세그먼트만으로는 경로를 만들 수 없다.
    // CTerminalRouter.ts의 buildTerminalUiInject()가 실제 위치를 계산해 window.__ARTGINE_BASE__로
    // 주입해주므로 그 값을 그대로 쓴다.
    var _authTokenMod = null;
    var _authTokenReady = import(window.location.origin + window.__ARTGINE_BASE__ + 'server/CAuthToken.js')
        .then(function(m) { _authTokenMod = m; })
        .catch(function(e) { console.error('[terminal_ui] CAuthToken.js load failed:', e); });

    var _storedToken = '';

    function _PW(u, p) {
        var pr = window.location.protocol === "https:" ? "wss:" : "ws:";
        var params = new URLSearchParams(window.location.search);
        // 인증은 WS 핸드셰이크에 자동 전송되는 세션 쿠키로 처리된다(토큰 불필요).
        u = pr + "//" + window.location.hostname + ":" + window.location.port + window.__CTX_PATH__ + "/cmd/ttyd-ws?" + params.toString();
        var ws = p ? new _W(u, p) : new _W(u);
        _wsRef = ws;
        return ws;
    }
    _PW.prototype = _W.prototype;
    _PW.CONNECTING = 0; _PW.OPEN = 1; _PW.CLOSING = 2; _PW.CLOSED = 3;
    window.WebSocket = _PW;

    function _sendRaw(text) {
        if (!_wsRef || _wsRef.readyState !== 1) return;
        var b = _enc.encode(text);
        var p = new Uint8Array(b.length + 1);
        p[0] = 48; p.set(b, 1);
        _wsRef.send(p);
    }

    window.addEventListener("DOMContentLoaded", async function() {
        await _authTokenReady;
        _storedToken = _authTokenMod ? _authTokenMod.getAuthToken(_webRootUrl()) : '';
        window.__READ_ONLY = !_storedToken;
        console.log('[terminal_ui] DOMContentLoaded — __TTYD_MODE:', window.__TTYD_MODE, '| __READ_ONLY:', window.__READ_ONLY, '| token:', !!_storedToken);

        if (window.__READ_ONLY) {
            var _bar = document.createElement('div');
            _bar.style.cssText = 'position:fixed;bottom:0;left:0;right:0;z-index:10000;display:flex;align-items:center;gap:6px;padding:6px 8px;border-top:1px solid #444;background:#1a1a1a;';
            var _pw  = document.createElement('input');
            _pw.type = 'password'; _pw.placeholder = 'Password';
            _pw.style.cssText = 'flex:1;padding:5px 8px;background:#2a2a2a;border:1px solid #555;border-radius:4px;color:#fff;font-size:0.9rem;min-width:0;';
            var _msg = document.createElement('span');
            _msg.style.cssText = 'color:#f55;font-size:0.8rem;white-space:nowrap;';
            var _btn = document.createElement('button');
            _btn.textContent = 'Login';
            _btn.style.cssText = 'padding:5px 14px;background:#0d6efd;border:none;border-radius:4px;color:#fff;cursor:pointer;white-space:nowrap;';
            _bar.appendChild(_pw); _bar.appendChild(_msg); _bar.appendChild(_btn);
            document.body.appendChild(_bar);
            document.body.style.paddingBottom = '46px';
            var _doAuth = function() {
                var password = _pw.value;
                if (!password) return;
                _btn.disabled = true; _msg.textContent = '';
                var _base = window.__CTX_PATH__ + '/';
                fetch(_base + 'auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password: password })
                })
                .then(function(r) { return r.json(); })
                .then(function(j) {
                    if (j.ok) { if (_authTokenMod) _authTokenMod.setAuthToken(_webRootUrl(), j.token); location.reload(); }
                    else { _msg.textContent = j.msg || 'Wrong password'; _btn.disabled = false; _pw.value = ''; _pw.focus(); }
                })
                .catch(function() { _msg.textContent = 'Connection failed'; _btn.disabled = false; });
            };
            _btn.addEventListener('click', _doAuth);
            _pw.addEventListener('keydown', function(e) { if (e.key === 'Enter') _doAuth(); });
            return;
        }

        var bar = document.createElement("div");
        bar.id = "mi-bar";

        var inp = document.createElement("textarea");
        inp.rows = 1;
        inp.placeholder = "Type then Enter...";
        inp.autocomplete = "off"; inp.autocorrect = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;

        var ddWrap = document.createElement("div");
        ddWrap.style.position = "relative";

        var ddBtn = document.createElement("button");
        ddBtn.id = "mi-dd-btn";
        ddBtn.textContent = "⌨";

        var ddMenu = document.createElement("ul");
        ddMenu.id = "mi-dd-menu";

        // ---- dropdown toggle ----
        ddBtn.addEventListener("click", function(e) {
            e.stopPropagation();
            var isOpen = ddMenu.classList.contains("show");
            closeAllSubmenus();
            if (isOpen) {
                ddMenu.classList.remove("show");
            } else {
                var rect = ddBtn.getBoundingClientRect();
                ddMenu.style.bottom = (window.innerHeight - rect.top + 4) + "px";
                ddMenu.style.right  = (window.innerWidth - rect.right) + "px";
                ddMenu.classList.add("show");
            }
        });

        document.addEventListener("click", function() {
            ddMenu.classList.remove("show");
            closeAllSubmenus();
        });

        // ---- action handler ----
        function _doAgentAction(kind) {
            var m = window.__TTYD_MODE;
            if (kind === "resume") {
                if (m === "claude" || m === "codex" || m === "antigravity") { _sendRaw("/resume"); return; }
                if (m === "gemini") { _sendRaw("/chat resume"); return; }
            }
            if (kind === "compact") {
                if (m === "claude" || m === "gemini" || m === "codex") { _sendRaw("/compact"); return; }
            }
            if (kind === "exit") {
                if (m === "codex")  { _sendRaw("\x04"); return; }
                if (m === "claude" || m === "gemini") { _sendRaw("/exit"); return; }
            }
            if (kind === "clear") {
                if (m === "cmd") { _sendRaw("cls\r"); return; }
                _sendRaw("/clear");
            }
            if (kind === "status") {
                if (m === "gemini") { _sendRaw("/stats"); return; }
                if (m === "antigravity") { _sendRaw("/usage"); return; }
                if (m === "cmd") return;
                _sendRaw("/status");
            }
        }

        function hideBar() { bar.style.display = "none"; document.body.style.paddingBottom = "0"; }

        function _sendResize() {
            window.dispatchEvent(new Event('resize'));
        }

        // ---- super mode (서버 측 무조건 자동승인, 세션별) ----
        var _superOn = false;
        var _superToken = new URLSearchParams(window.location.search).get("token") || "";
        function _superUrl(extra) {
            var ctxPath = "/" + window.location.pathname.split("/")[1];
            var q = "token=" + encodeURIComponent(_superToken);
            if (_storedToken) q += "&authToken=" + encodeURIComponent(_storedToken);
            return ctxPath + "/cmd/super-mode?" + q + (extra || "");
        }
        function _setSuperUI(on) {
            _superOn = !!on;
            inp.classList.toggle("super", _superOn);
            //superItem.querySelector(".mi-item").classList.toggle("super-on", _superOn);
            //superItem.querySelector(".mi-item").textContent = (_superOn ? "⚡ SUPER (ON)" : "⚡ SUPER (auto-approve)");
        }
        function _toggleSuper() {
            fetch(_superUrl("&on=" + (_superOn ? "0" : "1")))
                .then(function(r) { return r.json(); })
                .then(function(j) { if (j.ok) _setSuperUI(j.super); });
        }
        function _initSuper() {
            if (!_superToken || !_storedToken) return;
            fetch(_superUrl())
                .then(function(r) { return r.json(); })
                .then(function(j) { if (j.ok) _setSuperUI(j.super); })
                .catch(function() {});
        }
        function showBarAndFocusInput() {
            bar.style.display = "flex";
            document.body.style.paddingBottom = "50px";
            inp.focus();
        }

        // codex TUI는 표준 PageUp/Down(\x1b[5~/\x1b[6~)을 해석하지 못해 위/아래 화살표 반복 전송으로
        // 스크롤을 흉내낸다(휠 스크롤과 동일 로직). Ctrl+T(\x14)는 codex의 스크롤 모드 진입/이탈 토글.
        var _scrollDepth = 0;
        function _codexScrollUp() {
            var prev = _scrollDepth;
            _scrollDepth++;
            _sendRaw("\x1b[A");
            if (prev === 0) _sendRaw("\x14");
        }
        function _codexScrollDown() {
            var prev = _scrollDepth;
            if (_scrollDepth > 0) _scrollDepth--;
            _sendRaw("\x1b[B");
            if (prev === 1 && _scrollDepth === 0) _sendRaw("\x14");
        }
        function _doPageUp() {
            if (window.__TTYD_MODE === 'codex') { _codexScrollUp(); return; }
            _sendRaw("\x1b[5~");
        }
        function _doPageDown() {
            if (window.__TTYD_MODE === 'codex') { _codexScrollDown(); return; }
            _sendRaw("\x1b[6~");
        }

        _initSuper();
        setInterval(function() {
            if (!document.hidden) _initSuper();
        }, 60000);
        window.addEventListener("keydown", function(e) {
            if (e.key === "F6") {
                e.preventDefault(); e.stopPropagation();
                _toggleSuper();
                showBarAndFocusInput();
            }
        }, true);

        function handleAction(seq) {
            console.log('[terminal_ui] action:', seq, '| mode:', window.__TTYD_MODE);
            ddMenu.classList.remove("show");
            closeAllSubmenus();
            if      (seq === "__SCROLL__")       { var vp = document.querySelector(".xterm-viewport"); if (vp) vp.scrollTop = vp.scrollHeight; }
            else if (seq === "__TOGGLE_INPUT__") { hideBar(); }
            else if (seq === "__RESIZE__")       { _sendResize(); }
            else if (seq === "__PAGE_UP__")      { _doPageUp(); }
            else if (seq === "__PAGE_DOWN__")    { _doPageDown(); }
            else if (seq === "__ESC__")          { _sendRaw("\x1b"); inp.focus(); }
            else if (seq === "__SUPER__")        { _toggleSuper(); }
            else if (seq === "__RESUME__")       { _doAgentAction("resume"); }
            else if (seq === "__COMPACT__")      { _doAgentAction("compact"); }
            else if (seq === "__CLEAR__")        { _doAgentAction("clear"); }
            else if (seq === "__STATUS__")       { _doAgentAction("status"); }
            else if (seq === "__EXIT__")         { _doAgentAction("exit"); }
            else if (seq === "__MODEL__")        { inp.value = "/model "; autoHeight(); inp.focus(); }
            else if (seq && seq.startsWith("__SKILL__:")) {
                var skillName = seq.slice("__SKILL__:".length);
                var skill = (window.__SKILLS__ || []).find(function(s) { return s.name === skillName; });
                if (skill) { inp.value = skill.content; autoHeight(); inp.focus(); }
            }
            else if (seq !== null)               { _sendRaw(seq); }
        }

        // ---- helpers ----
        function makeSep() {
            var li = document.createElement("li");
            li.className = "mi-sep";
            return li;
        }

        function makeItem(label, seq) {
            var li = document.createElement("li");
            var b = document.createElement("button");
            b.className = "mi-item";
            b.type = "button";
            b.textContent = label;
            b.addEventListener("click", function(e) { e.stopPropagation(); handleAction(seq); });
            li.appendChild(b);
            return li;
        }

        function makeSubmenu(label, items) {
            var li = document.createElement("li");
            li.className = "mi-sub-wrap";

            var trigger = document.createElement("button");
            trigger.className = "mi-item mi-sub-trigger";
            trigger.type = "button";
            trigger.innerHTML = label + '<span>&#9664;</span>';

            var sub = document.createElement("ul");
            sub.className = "mi-submenu";
            items.forEach(function(a) { sub.appendChild(makeItem(a[0], a[1])); });

            trigger.addEventListener("click", function(e) {
                e.stopPropagation();
                var isOpen = sub.classList.contains("show");
                closeAllSubmenus();
                if (!isOpen) {
                    var rect = trigger.getBoundingClientRect();
                    sub.style.top    = "auto";
                    sub.style.bottom = (window.innerHeight - rect.bottom) + "px";
                    sub.style.right  = (window.innerWidth - rect.left + 4) + "px";
                    sub.classList.add("show");
                }
            });

            li.appendChild(trigger);
            li.appendChild(sub);
            return li;
        }

        function closeAllSubmenus() {
            ddMenu.querySelectorAll(".mi-submenu").forEach(function(m) {
                m.classList.remove("show");
            });
        }

        // ---- build menu ----
        ddMenu.appendChild(makeSubmenu("View", [
            ["⬇ Scroll to bottom", "__SCROLL__"],
            ["↔ Resize to window", "__RESIZE__"],
            ["⇞ Page Up",          "__PAGE_UP__"],
            ["⇟ Page Down",        "__PAGE_DOWN__"],
            ["⌨ Hide input bar",   "__TOGGLE_INPUT__"],
        ]));
        ddMenu.appendChild(makeSep());
        ddMenu.appendChild(makeItem("↑ Up",    "\x1b[A"));
        ddMenu.appendChild(makeItem("↓ Down",  "\x1b[B"));
        ddMenu.appendChild(makeItem("← Left",  "\x1b[D"));
        ddMenu.appendChild(makeItem("→ Right", "\x1b[C"));
        ddMenu.appendChild(makeSep());
        var superItem = makeItem("⚡ SUPER", "__SUPER__");
        ddMenu.appendChild(superItem);
        ddMenu.appendChild(makeSep());
        ddMenu.appendChild(makeItem("↵ Enter", "\r"));
        ddMenu.appendChild(makeItem("ESC",     "__ESC__"));
        ddMenu.appendChild(makeSep());
        ddMenu.appendChild(makeSubmenu("Command", [
            ["⏮ RESUME",  "__RESUME__"],
            ["🤖 MODEL",   "__MODEL__"],
            ["🗜 COMPACT", "__COMPACT__"],
            ["🧹 CLEAR",   "__CLEAR__"],
            ["📊 STATUS",  "__STATUS__"],
            ["⏻ EXIT",    "__EXIT__"],
        ]));
        var skillItems = [];
        (window.__SKILLS__ || []).forEach(function(s) {
            var label = s.name.length > 20 ? s.name.slice(0, 18) + '…' : s.name;
            skillItems.push(["📝 " + label, "__SKILL__:" + s.name]);
        });
        ddMenu.appendChild(makeSubmenu("Skill", skillItems));

        ddWrap.appendChild(ddBtn);
        ddWrap.appendChild(ddMenu);
        bar.appendChild(inp);
        bar.appendChild(ddWrap);
        document.body.appendChild(bar);
        document.body.style.paddingBottom = "50px";

        function autoHeight() { inp.style.height = "0"; inp.style.height = Math.min(inp.scrollHeight, 200) + "px"; }

        function normalizeInputCommand(text) {
            var cmd = text.trim();
            var mode = window.__TTYD_MODE;
            if (mode === "gemini") {
                if (cmd === "/status") return "/stats";
                if (cmd === "/resume") return "/chat resume";
            }
            if (mode === "antigravity" && cmd === "/status") return "/usage";
            return text;
        }

        function sendInput() {
            var text = normalizeInputCommand(inp.value);
            if (text.trim() === "/super") { _toggleSuper(); inp.value = ""; autoHeight(); inp.focus(); return; }
            if (text) {
                if (window.__TTYD_MODE === "gemini" || window.__TTYD_MODE === "antigravity") _sendRaw("\x1b[200~" + text + "\x1b[201~");
                else _sendRaw(text);
                if (!text.startsWith("/")) _sendRaw("\r");
            } else {
                _sendRaw("\r");
            }
            inp.value = ""; autoHeight(); inp.focus();
        }

        // ---- autocomplete ----
        var _cmdList = ['/compact', '/resume', '/model', '/continue', '/exit', '/clear', '/status', '/help'];

        var acBox = document.createElement("ul");
        acBox.id = "mi-ac";
        document.body.appendChild(acBox);

        var _acIdx = -1;
        function _acItems() { return acBox.querySelectorAll(".mi-ac-item"); }

        function _acHide() { acBox.style.display = "none"; acBox.innerHTML = ""; _acIdx = -1; }

        function _acApply(item) {
            inp.value = item.skill ? item.skill.content : item.cmd;
            autoHeight(); _acHide(); inp.focus();
        }

        function _acSelect(idx) {
            _acItems().forEach(function(el, i) { el.classList.toggle("active", i === idx); });
            _acIdx = idx;
        }

        function _acShow(matches) {
            acBox.innerHTML = ""; _acIdx = -1;
            if (!matches.length) { _acHide(); return; }
            var barRect = bar.getBoundingClientRect();
            acBox.style.left   = barRect.left + "px";
            acBox.style.bottom = (window.innerHeight - barRect.top + 4) + "px";
            matches.forEach(function(item) {
                var li = document.createElement("li");
                var btn = document.createElement("button");
                btn.className = "mi-ac-item";
                btn.type = "button";
                btn.textContent = item.label;
                btn._acItem = item;
                btn.addEventListener("mousedown", function(e) { e.preventDefault(); _acApply(item); });
                li.appendChild(btn);
                acBox.appendChild(li);
            });
            acBox.style.display = "block";
        }

        function _acUpdate() {
            var val = inp.value;
            if (!val.startsWith("/")) { _acHide(); return; }
            var items = _cmdList.map(function(c) { return { label: c, cmd: c }; });
            items.push({ label: '/super (toggle auto-approve)', cmd: '/super' });
            (window.__SKILLS__ || []).forEach(function(s) { items.push({ label: '/' + s.name, cmd: '/' + s.name, skill: s }); });
            var matches = items.filter(function(it) { return it.cmd.startsWith(val) && it.cmd !== val; });
            _acShow(matches);
        }

        // 슬래시 명령어 입력 시 두벌식 한글→영문 자동 역변환
        (function() {
            var _cho  = ['r','R','s','e','E','f','a','q','Q','t','T','d','w','W','c','z','x','v','g'];
            var _jung = ['k','o','i','O','j','p','u','P','h','hk','ho','hl','y','n','nj','np','nl','b','m','ml','l'];
            var _jong = ['','r','R','rt','s','sw','sg','e','f','fr','fa','fq','ft','fx','fv','fg','a','q','qt','t','T','d','w','c','z','x','v','g'];
            var _jamo = {
                'ㄱ':'r','ㄲ':'R','ㄳ':'rt','ㄴ':'s','ㄵ':'sw','ㄶ':'sg',
                'ㄷ':'e','ㄸ':'E','ㄹ':'f','ㄺ':'fr','ㄻ':'fa','ㄼ':'fq',
                'ㄽ':'ft','ㄾ':'fx','ㄿ':'fv','ㅀ':'fg','ㅁ':'a','ㅂ':'q',
                'ㅃ':'Q','ㅄ':'qt','ㅅ':'t','ㅆ':'T','ㅇ':'d','ㅈ':'w',
                'ㅉ':'W','ㅊ':'c','ㅋ':'z','ㅌ':'x','ㅍ':'v','ㅎ':'g',
                'ㅏ':'k','ㅐ':'o','ㅑ':'i','ㅒ':'O','ㅓ':'j','ㅔ':'p',
                'ㅕ':'u','ㅖ':'P','ㅗ':'h','ㅘ':'hk','ㅙ':'ho','ㅚ':'hl',
                'ㅛ':'y','ㅜ':'n','ㅝ':'nj','ㅞ':'np','ㅟ':'nl','ㅠ':'b',
                'ㅡ':'m','ㅢ':'ml','ㅣ':'l'
            };
            function _krToEn(str) {
                var out = '';
                for (var i = 0; i < str.length; i++) {
                    var c = str.charCodeAt(i);
                    if (c >= 0xAC00 && c <= 0xD7A3) {
                        var n = c - 0xAC00;
                        out += _cho[Math.floor(n/28/21)] + _jung[Math.floor(n/28)%21] + _jong[n%28];
                    } else {
                        out += _jamo[str[i]] || str[i];
                    }
                }
                return out;
            }
            inp.addEventListener('input', function(e) {
                autoHeight();
                _acUpdate();
            });
            inp.addEventListener('compositionend', function(e) {
                if (!inp.value.startsWith('/') || !e.data) return;
                var pos = inp.selectionStart;
                var start = pos - e.data.length;
                if (start < 0 || inp.value.slice(start, pos) !== e.data) return;
                // 아직 완성되지 않은 슬래시 커맨드 이름을 입력 중일 때만 변환한다.
                // (공백/추가 '/' 등이 섞이면 주석·문장이므로 건드리지 않음)
                if (!/^[A-Za-z]*$/.test(inp.value.slice(1, start))) return;
                var latin = _krToEn(e.data);
                if (latin === e.data) return;
                inp.value = inp.value.slice(0, start) + latin + inp.value.slice(pos);
                inp.setSelectionRange(start + latin.length, start + latin.length);
                autoHeight();
                _acUpdate();
            });
        })();

        inp.addEventListener("keydown", function(e) {
            var items = _acItems();
            if (acBox.style.display !== "none" && items.length) {
                if (e.key === "ArrowDown") { e.preventDefault(); _acSelect(Math.min(_acIdx + 1, items.length - 1)); return; }
                if (e.key === "ArrowUp")   { e.preventDefault(); _acSelect(Math.max(_acIdx - 1, 0)); return; }
                if (e.key === "Tab")       { e.preventDefault(); _acApply(items[Math.max(_acIdx, 0)]._acItem); return; }
                if (e.key === "Escape")    { _acHide(); return; }
                if (e.key === "Enter" && !e.shiftKey && !e.isComposing && _acIdx >= 0) {
                    e.preventDefault(); _acApply(items[_acIdx]._acItem); return;
                }
            }
            if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendInput(); }
            if (!inp.value) {
                var _arrows = { "ArrowUp": "\x1b[A", "ArrowDown": "\x1b[B", "ArrowLeft": "\x1b[D", "ArrowRight": "\x1b[C" };
                if (_arrows[e.key]) { e.preventDefault(); _sendRaw(_arrows[e.key]); return; }
            }
        });
        document.addEventListener("click", function(e) { if (!bar.contains(e.target)) _acHide(); });

        _initSuper();
        setTimeout(function() { inp.focus(); }, 500);
        setTimeout(_sendResize, 1000);

        if (window.__TTYD_MODE === 'codex') {
            document.addEventListener("wheel", function(e) {
                e.preventDefault(); e.stopPropagation();
                if (e.deltaY < 0) _codexScrollUp(); else _codexScrollDown();
            }, { passive: false, capture: true });
            (function _attachCodexKeys() {
                if (!window.term || typeof window.term.attachCustomKeyEventHandler !== 'function') {
                    setTimeout(_attachCodexKeys, 200); return;
                }
                window.term.attachCustomKeyEventHandler(function(e) {
                    if (e.type !== 'keydown') return true;
                    if (e.key === 'PageUp')   { _codexScrollUp();   return false; }
                    if (e.key === 'PageDown') { _codexScrollDown(); return false; }
                    return true;
                });
            })();
        }

        document.addEventListener("wheel", function(e) {
            if (window.__TTYD_MODE !== "opencode") return;
            e.preventDefault();
            e.stopPropagation();
            _sendRaw(e.deltaY < 0 ? "\x1b[5~" : "\x1b[6~");
        }, { passive: false, capture: true });

        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'focus-input') {
                showBarAndFocusInput();
            }
        });
    });
})();
</script>
