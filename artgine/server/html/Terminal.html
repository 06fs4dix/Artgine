<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Terminal</title>
<!--INJECT-->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #xt { position:fixed; top:0; left:0; right:0; bottom:0; }
  #mi-bar { position:fixed;bottom:0;left:0;right:0;z-index:10000;display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #444;background:#1a1a1a;box-sizing:border-box; }
  #mi-bar textarea { flex:1;padding:5px 8px;background:#2a2a2a;border:1px solid #555;border-radius:4px;color:#fff;font-family:monospace;font-size:0.9rem;resize:none;line-height:1.4;max-height:200px;overflow-y:auto;min-width:0;box-sizing:border-box; }
  #mi-bar textarea:focus { outline:none;border-color:#00e5a0; }
  #mi-bar textarea.super, #mi-bar textarea.super:focus { border-color:#ff3b3b !important;background:#2a0e0e !important;color:#ff7a7a; }
  #mi-dd-btn { padding:5px 12px;background:#555;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:1.2rem;white-space:nowrap;line-height:1.4; }
  #mi-dd-btn:hover { background:#666; }
  #mi-dd-menu { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10001;width:max-content;min-width:0;max-width:calc(100vw - 16px);list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
  #mi-dd-menu.show { display:block; }
  .mi-item { display:block;width:100%;padding:6px 10px;background:none;border:none;color:#ddd;text-align:left;cursor:pointer;font-size:0.9rem;white-space:nowrap;box-sizing:border-box; }
  .mi-item:hover { background:#3a3a3a;color:#fff; }
  .mi-sep { height:1px;background:#444;margin:4px 0;list-style:none; }
  .mi-sub-wrap { position:relative; }
  .mi-sub-trigger { display:flex;justify-content:space-between;align-items:center; }
  .mi-submenu { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10002;width:max-content;min-width:0;max-width:calc(100vw - 16px);max-height:60vh;overflow-y:auto;list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
  .mi-submenu.show { display:block; }
  #mi-ac { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10002;max-height:40vh;overflow-y:auto;min-width:220px;list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
  .mi-ac-item { display:block;width:100%;padding:4px 12px;background:none;border:none;color:#ddd;text-align:left;cursor:pointer;font-family:monospace;font-size:0.85rem;white-space:nowrap;box-sizing:border-box; }
  .mi-ac-item:hover,.mi-ac-item.active { background:#3a3a3a;color:#fff; }
</style>
</head>
<body>
<div id="xt"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var token = params.get("token") || "";
  var MODE = window.__TERM_MODE;

  // 이 파일은 module이 아닌 일반 <script>이고, CTerminalRouter가 실제 파일 경로가 아니라
  // /cmd/terminal-proxy 같은 프록시 URL로 서빙하므로 상대경로 import("./CIframeMsg.js")는 404난다.
  // CAuthToken.js와 동일하게 서버가 주입한 __ARTGINE_BASE__ 기준 절대경로로 로드한다.
  var _iframeMsg = import(window.location.origin + window.__ARTGINE_BASE__ + "server/html/CIframeMsg.js");
  function sendToParent(type, data) {
    if (!window.parent) return;
    _iframeMsg.then(function (m) { m.CIframeMsg.Send(window.parent, type, data); });
  }
  function recvFromParent(handlers) {
    _iframeMsg.then(function (m) { m.CIframeMsg.Recv(handlers); });
  }

  // ---- xterm 인스턴스(직접 소유) ----
  var term = new Terminal({ cursorBlink: true, fontSize: 14, scrollback: 20000,
                            allowProposedApi: true,
                            theme: { background: "#000000" } });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  // 이모지 등 넓은 글자의 폭을 올바르게 계산(기본 유니코드6은 다수 이모지를 1칸으로 오판해 잘려 보임)
  term.loadAddon(new Unicode11Addon.Unicode11Addon());
  term.unicode.activeVersion = "11";
  term.open(document.getElementById("xt"));
  // webgl 렌더러: DOM 렌더러 대신 글리프를 텍스처로 정수 스냅 렌더링 → 행/셀 미세 간극 제거.
  // open() 이후에 로드해야 캔버스를 부착(실패 시 자동으로 DOM 렌더러 fallback).
  try { term.loadAddon(new WebglAddon.WebglAddon()); } catch (e) { console.warn("[terminal] webgl addon failed, fallback to DOM:", e); }
  // 출력의 URL을 클릭 가능한 링크로 인식(구 ttyd 웹클라이언트 기본 동작의 대체).
  term.loadAddon(new WebLinksAddon.WebLinksAddon(function (e, uri) { window.open(uri, "_blank", "noopener,noreferrer"); }));
  // xterm 코어의 링크 인식(Linkifier)은 mousemove로 호버를 추적한 뒤 mousedown/mouseup으로 활성화하는
  // 방식이라 호버가 없는 터치 디바이스에서는 동작하지 않는다. 탭 위치를 버퍼 좌표로 직접 변환해
  // WebLinksAddon과 동일한 URL 정규식으로 같은 줄에서 링크를 찾아 여는 터치 전용 보완 로직.
  (function () {
    var urlRegex = /(https?|HTTPS?):[/]{2}[^\s"'!*(){}|\\\^<>`]*[^\s"':,.!?{}|\\\^~\[\]`()<>]/g;
    // 드라이브 문자(D:\...)로 시작하는 절대경로 또는 슬래시/역슬래시가 섞인 상대경로(artgine\server\html\x.ts) 인식.
    // 확장자로 끝나는 경로만 매칭(디렉터리만 있는 문자열은 오탐 가능성이 커서 제외).
    var pathRegex = /(?:[A-Za-z]:[\\/])?(?:[\w.-]+[\\/])+[\w.-]+\.[A-Za-z0-9]+/g;
    var TAP_MOVE_TOLERANCE = 24; // px: 이보다 많이 움직이면 스크롤/드래그로 간주해 탭으로 취급하지 않음(터치 접촉 떨림 감안)

    // 탭/클릭 좌표(clientX/clientY)를 버퍼상의 (row, col)로 변환하고, 그 줄에서 URL/경로 매칭을 찾는다.
    function findTapMatch(clientX, clientY) {
      var core = term._core;
      var dims = core && core._renderService && core._renderService.dimensions;
      if (!dims) return null;
      var rect = term.element.getBoundingClientRect();
      var col = Math.floor((clientX - rect.left) / dims.css.cell.width);
      var row = Math.floor((clientY - rect.top) / dims.css.cell.height);
      var line = term.buffer.active.getLine(term.buffer.active.viewportY + row);
      if (!line) return null;
      var text = line.translateToString(true);
      urlRegex.lastIndex = 0;
      var m;
      while ((m = urlRegex.exec(text))) {
        if (col >= m.index && col < m.index + m[0].length) return { type: "url", text: m[0] };
      }
      pathRegex.lastIndex = 0;
      while ((m = pathRegex.exec(text))) {
        if (col >= m.index && col < m.index + m[0].length) return { type: "path", text: m[0] };
      }
      return null;
    }

    function handleTapMatch(match) {
      if (!match) return;
      if (match.type === "url") window.open(match.text, "_blank", "noopener,noreferrer");
      else if (match.type === "path") sendToParent("terminal-path-tapped", { path: match.text, token: token });
    }

    // 호버가 없는 터치 디바이스에서는 xterm 코어의 링크 인식(mousemove로 호버 추적 후 mousedown/mouseup으로
    // 활성화)이 동작하지 않으므로 탭 위치를 버퍼 좌표로 직접 변환하는 터치 전용 보완 로직.
    var touchStart = null;
    term.element.addEventListener("touchstart", function (e) {
      var t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    term.element.addEventListener("touchend", function (e) {
      var start = touchStart;
      touchStart = null;
      if (!start || !e.changedTouches.length) return;
      var t = e.changedTouches[0];
      if (Math.hypot(t.clientX - start.x, t.clientY - start.y) > TAP_MOVE_TOLERANCE) return;
      handleTapMatch(findTapMatch(t.clientX, t.clientY));
    }, { passive: true });

    // 마우스: URL은 WebLinksAddon이 코어 Linkifier(호버 밑줄+클릭 활성화)로 처리하지만,
    // WebLinksAddon은 매칭된 텍스트가 유효한 URL로 파싱될 때만 링크로 인정하므로 경로 문자열은
    // 걸러진다. 그래서 경로 전용 커스텀 링크 프로바이더를 등록해 같은 호버 밑줄/클릭 동작을 재현한다.
    term.registerLinkProvider({
      provideLinks: function (bufferLineNumber, callback) {
        var line = term.buffer.active.getLine(bufferLineNumber - 1);
        if (!line) { callback(undefined); return; }
        var text = line.translateToString(true);
        urlRegex.lastIndex = 0;
        var urlRanges = [];
        var um;
        while ((um = urlRegex.exec(text))) urlRanges.push([um.index, um.index + um[0].length]);
        pathRegex.lastIndex = 0;
        var links = [];
        var m;
        while ((m = pathRegex.exec(text))) {
          var s = m.index, e = m.index + m[0].length;
          // URL과 겹치는 구간은 WebLinksAddon이 이미 링크로 처리하므로 중복 등록하지 않는다.
          if (urlRanges.some(function (r) { return s < r[1] && e > r[0]; })) continue;
          links.push({
            text: m[0],
            range: { start: { x: s + 1, y: bufferLineNumber }, end: { x: e, y: bufferLineNumber } },
            activate: function (_e, linkText) { sendToParent("terminal-path-tapped", { path: linkText, token: token }); },
          });
        }
        callback(links.length ? links : undefined);
      }
    });
  })();
  fit.fit();
  window.term = term; // 하위 호환(외부 스크립트가 참조)

  var ws = null;
  var disconnected = false;
  // 핸드오프 진행 중에는 이 세션의 모든 입력을 막는다(리드모드처럼). 하단 입력창뿐 아니라
  // xterm 화면 직접 입력(term.onData)·메뉴·방향키가 전부 sendRaw를 거치므로 여기서 한 번에 차단한다.
  var _handoffLock = false;
  function sendRaw(text) { if (_handoffLock) return; if (ws && ws.readyState === 1) ws.send(text); }
  // grok은 ESC를 취소로 받지 않아 Ctrl+C를 대신 보낸다(다른 CLI의 ESC와 같은 결과).
  function sendEsc() { sendRaw(MODE === "grok" ? "\x03" : "\x1b"); }
  function sendResize() {
    fit.fit();
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
  }

  // codex/opencode scroll emulation (우리 term 사용)
  var _scrollDepth = 0;
  function _codexUp()   { var p = _scrollDepth++; sendRaw("\x1b[A"); if (p === 0) sendRaw("\x14"); }
  function _codexDown() { var p = _scrollDepth; if (_scrollDepth > 0) _scrollDepth--; sendRaw("\x1b[B"); if (p === 1 && _scrollDepth === 0) sendRaw("\x14"); }

  // xterm 화면(#xt) 자체에 포커스가 있을 때도 Tab은 항상 부모(Home)로 전달해 사이드바를 토글한다.
  // (하단 입력창 inp에 포커스가 있을 때의 Tab 처리는 buildInputBar 안의 별도 리스너가 담당)
  term.attachCustomKeyEventHandler(function (e) {
    if (e.type !== "keydown") return true;
    if (e.key === "Tab") { e.preventDefault(); sendToParent("terminal-tab-key"); return false; }
    if (MODE === "codex") {
      if (e.key === "PageUp")   { _codexUp();   return false; }
      if (e.key === "PageDown") { _codexDown(); return false; }
    }
    return true;
  });

  function connect() {
    var pr = window.location.protocol === "https:" ? "wss:" : "ws:";
    // 인증은 WS 핸드셰이크에 자동 첨부되는 세션 쿠키로 처리(서버 isAuthedUpgrade). 토큰은 세션 식별용.
    var url = pr + "//" + window.location.host + window.__CTX_PATH__ + "/cmd/term-ws?token=" + encodeURIComponent(token);
    ws = new WebSocket(url);
    ws.onopen = function () { disconnected = false; sendResize(); };
    ws.onmessage = function (ev) { term.write(typeof ev.data === "string" ? ev.data : ev.data); };
    ws.onclose = function () { disconnected = true; term.write("\r\n\x1b[31m[disconnected] retry: Enter\x1b[m\r\n"); };
  }

  // ---- 읽기전용 판정: 저장 토큰 유무(원본 Terminal.html과 동일 소스) ----
  var _authTokenMod = null;
  function _webRootUrl() {
    var seg = window.location.pathname.split("/")[1] || "";
    return window.location.protocol + "//" + window.location.host + "/" + seg + "/";
  }
  var _ready = import(window.location.origin + window.__ARTGINE_BASE__ + "server/CAuthToken.js")
      .then(function (m) { _authTokenMod = m; })
      .catch(function (e) { console.error("[terminal] CAuthToken.js load failed:", e); });

  window.addEventListener("DOMContentLoaded", async function () {
    await _ready;
    var storedToken = _authTokenMod ? _authTokenMod.getAuthToken(_webRootUrl()) : "";
    var readOnly = !storedToken;
    window.__READ_ONLY = readOnly;

    term.onData(function (d) {
      if (disconnected) { if (d === "\r") { disconnected = false; connect(); } return; }
      if (!readOnly) sendRaw(d);
    });
    window.addEventListener("resize", sendResize);
    connect();

    if (readOnly) { buildLoginBar(); return; }
    buildInputBar(storedToken);
  });

  // ---- 읽기전용: 로그인 바 ----
  function buildLoginBar() {
    var bar = document.createElement("div"); bar.id = "mi-bar";
    var pw = document.createElement("input"); pw.type = "password"; pw.placeholder = "Password";
    pw.style.cssText = "flex:1;padding:5px 8px;background:#2a2a2a;border:1px solid #555;border-radius:4px;color:#fff;font-size:0.9rem;min-width:0;";
    var msg = document.createElement("span"); msg.style.cssText = "color:#f55;font-size:0.8rem;white-space:nowrap;";
    var btn = document.createElement("button"); btn.textContent = "Login";
    btn.style.cssText = "padding:5px 14px;background:#0d6efd;border:none;border-radius:4px;color:#fff;cursor:pointer;white-space:nowrap;";
    bar.appendChild(pw); bar.appendChild(msg); bar.appendChild(btn);
    document.body.appendChild(bar);
    document.getElementById("xt").style.bottom = "46px"; fit.fit();
    function doAuth() {
      if (!pw.value) return;
      btn.disabled = true; msg.textContent = "";
      fetch(window.__CTX_PATH__ + "/auth/login", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ password: pw.value })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j.ok) { if (_authTokenMod) _authTokenMod.setAuthToken(_webRootUrl(), j.token); location.reload(); }
        else { msg.textContent = j.msg || "Wrong password"; btn.disabled = false; pw.value = ""; pw.focus(); }
      }).catch(function () { msg.textContent = "Connection failed"; btn.disabled = false; });
    }
    btn.addEventListener("click", doAuth);
    pw.addEventListener("keydown", function (e) { if (e.key === "Enter") doAuth(); });
  }

  // ---- 쓰기: 입력 바 + 메뉴 (원본 Terminal.html 포팅, sendRaw만 교체) ----
  function buildInputBar(storedToken) {
    var bar = document.createElement("div"); bar.id = "mi-bar";
    var inp = document.createElement("textarea"); inp.rows = 1; inp.placeholder = "Type then Enter...";
    inp.autocomplete = "off"; inp.autocorrect = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;
    var ddWrap = document.createElement("div"); ddWrap.style.position = "relative";
    var ddBtn = document.createElement("button"); ddBtn.id = "mi-dd-btn"; ddBtn.textContent = "⌨";
    var ddMenu = document.createElement("ul"); ddMenu.id = "mi-dd-menu";

    function showBar() { bar.style.display = "flex"; document.getElementById("xt").style.bottom = "50px"; fit.fit(); }
    function hideBar() { bar.style.display = "none"; document.getElementById("xt").style.bottom = "0"; fit.fit(); }
    function autoHeight() { inp.style.height = "0"; inp.style.height = Math.min(inp.scrollHeight, 200) + "px"; }

    // super mode
    var _superOn = false;
    function _superUrl(extra) {
      var q = "token=" + encodeURIComponent(token);
      if (storedToken) q += "&authToken=" + encodeURIComponent(storedToken);
      return window.__CTX_PATH__ + "/cmd/super-mode?" + q + (extra || "");
    }
    function _setSuper(on) { _superOn = !!on; inp.classList.toggle("super", _superOn); }
    function _toggleSuper() { fetch(_superUrl("&on=" + (_superOn ? "0" : "1"))).then(function (r) { return r.json(); }).then(function (j) { if (j.ok) _setSuper(j.super); }); }
    function _initSuper() { fetch(_superUrl()).then(function (r) { return r.json(); }).then(function (j) { if (j.ok) _setSuper(j.super); }).catch(function () {}); }

    function _pageUp()    { if (MODE === "codex") { _codexUp(); return; } sendRaw("\x1b[5~"); }
    function _pageDown()  { if (MODE === "codex") { _codexDown(); return; } sendRaw("\x1b[6~"); }

    function agentAction(kind) {
      if (kind === "resume")  { if (MODE === "claude" || MODE === "codex" || MODE === "antigravity") return sendRaw("/resume"); if (MODE === "gemini") return sendRaw("/chat resume"); }
      if (kind === "compact") { if (MODE === "claude" || MODE === "gemini" || MODE === "codex") return sendRaw("/compact"); }
      if (kind === "exit")    { if (MODE === "codex") return sendRaw("\x04"); if (MODE === "claude" || MODE === "gemini") return sendRaw("/exit"); }
      if (kind === "clear")   { if (MODE === "cmd") return sendRaw("cls\r"); return sendRaw("/clear"); }
      if (kind === "status")  { if (MODE === "gemini") return sendRaw("/stats"); if (MODE === "antigravity") return sendRaw("/usage"); if (MODE === "cmd") return; sendRaw("/status"); }
    }

    function closeSubs() { ddMenu.querySelectorAll(".mi-submenu").forEach(function (m) { m.classList.remove("show"); }); }
    ddBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var open = ddMenu.classList.contains("show"); closeSubs();
      if (open) ddMenu.classList.remove("show");
      else { var r = ddBtn.getBoundingClientRect(); ddMenu.style.bottom = (window.innerHeight - r.top + 4) + "px"; ddMenu.style.right = (window.innerWidth - r.right) + "px"; ddMenu.classList.add("show"); }
    });
    document.addEventListener("click", function () { ddMenu.classList.remove("show"); closeSubs(); });

    function handleAction(seq) {
      if (seq === "__SCROLL__")       term.scrollToBottom();
      else if (seq === "__TOGGLE_INPUT__") hideBar();
      else if (seq === "__RESIZE__")  sendResize();
      else if (seq === "__PAGE_UP__") _pageUp();
      else if (seq === "__PAGE_DOWN__") _pageDown();
      else if (seq === "__ESC__")     { sendEsc(); inp.focus(); }
      else if (seq === "__SUPER__")   _toggleSuper();
      else if (seq === "__RESUME__")  agentAction("resume");
      else if (seq === "__COMPACT__") agentAction("compact");
      else if (seq === "__CLEAR__")   agentAction("clear");
      else if (seq === "__STATUS__")  agentAction("status");
      else if (seq === "__EXIT__")    agentAction("exit");
      else if (seq === "__MODEL__")   { inp.value = "/model "; autoHeight(); inp.focus(); }
      else if (seq && seq.indexOf("__SKILL__:") === 0) {
        var s = (window.__SKILLS__ || []).find(function (x) { return x.name === seq.slice(10); });
        if (s) { inp.value = s.content; autoHeight(); inp.focus(); }
      } else if (seq !== null) sendRaw(seq);
    }
    function mkSep() { var li = document.createElement("li"); li.className = "mi-sep"; return li; }
    function mkItem(label, seq) { var li = document.createElement("li"); var b = document.createElement("button"); b.className = "mi-item"; b.type = "button"; b.textContent = label; b.addEventListener("click", function (e) { e.stopPropagation(); handleAction(seq); }); li.appendChild(b); return li; }
    function mkSub(label, items) {
      var li = document.createElement("li"); li.className = "mi-sub-wrap";
      var tr = document.createElement("button"); tr.className = "mi-item mi-sub-trigger"; tr.type = "button"; tr.innerHTML = label + "<span>&#9664;</span>";
      var sub = document.createElement("ul"); sub.className = "mi-submenu";
      items.forEach(function (a) { sub.appendChild(mkItem(a[0], a[1])); });
      tr.addEventListener("click", function (e) { e.stopPropagation(); var open = sub.classList.contains("show"); closeSubs(); if (!open) { var r = tr.getBoundingClientRect(); sub.style.bottom = (window.innerHeight - r.bottom) + "px"; sub.style.right = (window.innerWidth - r.left + 4) + "px"; sub.classList.add("show"); } });
      li.appendChild(tr); li.appendChild(sub); return li;
    }
    ddMenu.appendChild(mkSub("View", [["⬇ Scroll to bottom", "__SCROLL__"], ["↔ Resize to window", "__RESIZE__"], ["⇞ Page Up", "__PAGE_UP__"], ["⇟ Page Down", "__PAGE_DOWN__"], ["⌨ Hide input bar", "__TOGGLE_INPUT__"]]));
    ddMenu.appendChild(mkSep());
    ddMenu.appendChild(mkItem("↑ Up", "\x1b[A")); ddMenu.appendChild(mkItem("↓ Down", "\x1b[B"));
    ddMenu.appendChild(mkItem("← Left", "\x1b[D")); ddMenu.appendChild(mkItem("→ Right", "\x1b[C"));
    ddMenu.appendChild(mkSep()); ddMenu.appendChild(mkItem("⚡ SUPER", "__SUPER__")); ddMenu.appendChild(mkSep());
    ddMenu.appendChild(mkItem("↵ Enter", "\r")); ddMenu.appendChild(mkItem("ESC", "__ESC__")); ddMenu.appendChild(mkSep());
    ddMenu.appendChild(mkSub("Command", [["⏮ RESUME", "__RESUME__"], ["🤖 MODEL", "__MODEL__"], ["🗜 COMPACT", "__COMPACT__"], ["🧹 CLEAR", "__CLEAR__"], ["📊 STATUS", "__STATUS__"], ["⏻ EXIT", "__EXIT__"]]));
    var skillItems = []; (window.__SKILLS__ || []).forEach(function (s) { var l = s.name.length > 20 ? s.name.slice(0, 18) + "…" : s.name; skillItems.push(["📝 " + l, "__SKILL__:" + s.name]); });
    ddMenu.appendChild(mkSub("Skill", skillItems));
    ddWrap.appendChild(ddBtn); ddWrap.appendChild(ddMenu);
    bar.appendChild(inp); bar.appendChild(ddWrap); document.body.appendChild(bar);
    showBar();

    // ---- 파일 드래그앤드롭: 서버(세션 workingDir/.uploads/)에 저장하고 경로를 입력창에 삽입 ----
    function _readAsBase64(file) {
      return new Promise(function (resolve, reject) {
        var r = new FileReader();
        r.onload = function () { resolve(String(r.result).split(",")[1] || ""); };
        r.onerror = reject;
        r.readAsDataURL(file);
      });
    }
    function _insertAtCursor(text) {
      var pos = inp.selectionStart >= 0 ? inp.selectionStart : inp.value.length;
      inp.value = inp.value.slice(0, pos) + text + inp.value.slice(pos);
      inp.setSelectionRange(pos + text.length, pos + text.length);
      autoHeight(); inp.focus();
    }
    function _uploadDroppedFile(file) {
      _readAsBase64(file).then(function (b64) {
        return fetch(window.__CTX_PATH__ + "/cmd/upload-file", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, name: file.name, data: b64 })
        });
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (!j.ok) { term.write("\r\n\x1b[31m[upload] Failed: " + (j.msg || "unknown error") + "\x1b[m\r\n"); return; }
        _insertAtCursor('"' + j.path + '" ');
      }).catch(function (e) {
        term.write("\r\n\x1b[31m[upload] Error: " + e + "\x1b[m\r\n");
      });
    }
    document.addEventListener("dragover", function (e) { e.preventDefault(); });
    document.addEventListener("drop", function (e) {
      e.preventDefault();
      var files = e.dataTransfer && e.dataTransfer.files;
      if (files && files.length) { for (var i = 0; i < files.length; i++) _uploadDroppedFile(files[i]); return; }
      // Control.ts 우측 사이드바 파일 목록에서 드래그해온 경우: 이미 서버에 있는 파일이라
      // 업로드 없이 text/plain으로 실어온 경로를 그대로 삽입한다.
      var textPath = e.dataTransfer && e.dataTransfer.getData("text/plain");
      if (textPath) _insertAtCursor('"' + textPath + '" ');
    });

    // ---- autocomplete ----
    var _cmdList = ["/compact", "/resume", "/model", "/continue", "/exit", "/clear", "/status", "/help"];
    var acBox = document.createElement("ul"); acBox.id = "mi-ac"; document.body.appendChild(acBox);
    var _acIdx = -1;
    function _acItems() { return acBox.querySelectorAll(".mi-ac-item"); }
    function _acHide() { acBox.style.display = "none"; acBox.innerHTML = ""; _acIdx = -1; }
    function _acApply(it) { inp.value = it.skill ? it.skill.content : it.cmd; autoHeight(); _acHide(); inp.focus(); }
    function _acSelect(i) { _acItems().forEach(function (el, k) { el.classList.toggle("active", k === i); }); _acIdx = i; }
    function _acShow(matches) {
      acBox.innerHTML = ""; _acIdx = -1; if (!matches.length) { _acHide(); return; }
      var r = bar.getBoundingClientRect(); acBox.style.left = r.left + "px"; acBox.style.bottom = (window.innerHeight - r.top + 4) + "px";
      matches.forEach(function (it) { var li = document.createElement("li"); var b = document.createElement("button"); b.className = "mi-ac-item"; b.type = "button"; b.textContent = it.label; b._it = it; b.addEventListener("mousedown", function (e) { e.preventDefault(); _acApply(it); }); li.appendChild(b); acBox.appendChild(li); });
      acBox.style.display = "block";
    }
    function _acUpdate() {
      var val = inp.value; if (val[0] !== "/") { _acHide(); return; }
      var items = _cmdList.map(function (c) { return { label: c, cmd: c }; });
      items.push({ label: "/super (toggle auto-approve)", cmd: "/super" });
      Object.keys(HANDOFF_ALIASES).forEach(function (a) { if (HANDOFF_ALIASES[a] !== MODE) items.push({ label: "/" + a + " (handoff → " + HANDOFF_ALIASES[a] + ")", cmd: "/" + a }); });
      (window.__SKILLS__ || []).forEach(function (s) { items.push({ label: "/" + s.name, cmd: "/" + s.name, skill: s }); });
      _acShow(items.filter(function (it) { return it.cmd.indexOf(val) === 0 && it.cmd !== val; }));
    }

    // ---- 두벌식 한글→영문 역변환(슬래시 명령용) ----
    var _cho = ["r","R","s","e","E","f","a","q","Q","t","T","d","w","W","c","z","x","v","g"];
    var _jung = ["k","o","i","O","j","p","u","P","h","hk","ho","hl","y","n","nj","np","nl","b","m","ml","l"];
    var _jong = ["","r","R","rt","s","sw","sg","e","f","fr","fa","fq","ft","fx","fv","fg","a","q","qt","t","T","d","w","c","z","x","v","g"];
    var _jamo = {"ㄱ":"r","ㄲ":"R","ㄳ":"rt","ㄴ":"s","ㄵ":"sw","ㄶ":"sg","ㄷ":"e","ㄸ":"E","ㄹ":"f","ㄺ":"fr","ㄻ":"fa","ㄼ":"fq","ㄽ":"ft","ㄾ":"fx","ㄿ":"fv","ㅀ":"fg","ㅁ":"a","ㅂ":"q","ㅃ":"Q","ㅄ":"qt","ㅅ":"t","ㅆ":"T","ㅇ":"d","ㅈ":"w","ㅉ":"W","ㅊ":"c","ㅋ":"z","ㅌ":"x","ㅍ":"v","ㅎ":"g","ㅏ":"k","ㅐ":"o","ㅑ":"i","ㅒ":"O","ㅓ":"j","ㅔ":"p","ㅕ":"u","ㅖ":"P","ㅗ":"h","ㅘ":"hk","ㅙ":"ho","ㅚ":"hl","ㅛ":"y","ㅜ":"n","ㅝ":"nj","ㅞ":"np","ㅟ":"nl","ㅠ":"b","ㅡ":"m","ㅢ":"ml","ㅣ":"l"};
    function _krToEn(str) { var out = ""; for (var i = 0; i < str.length; i++) { var c = str.charCodeAt(i); if (c >= 0xAC00 && c <= 0xD7A3) { var n = c - 0xAC00; out += _cho[Math.floor(n/28/21)] + _jung[Math.floor(n/28)%21] + _jong[n%28]; } else out += _jamo[str[i]] || str[i]; } return out; }
    inp.addEventListener("input", function () { autoHeight(); _acUpdate(); });
    inp.addEventListener("compositionend", function (e) {
      if (inp.value[0] !== "/" || !e.data) return;
      var pos = inp.selectionStart, start = pos - e.data.length;
      if (start < 0 || inp.value.slice(start, pos) !== e.data) return;
      if (!/^[A-Za-z]*$/.test(inp.value.slice(1, start))) return;
      var latin = _krToEn(e.data); if (latin === e.data) return;
      inp.value = inp.value.slice(0, start) + latin + inp.value.slice(pos);
      inp.setSelectionRange(start + latin.length, start + latin.length); autoHeight(); _acUpdate();
    });

    function normalize(text) {
      var c = text.trim();
      if (MODE === "gemini") { if (c === "/status") return "/stats"; if (c === "/resume") return "/chat resume"; }
      if (MODE === "antigravity" && c === "/status") return "/usage";
      return text;
    }
    // 핸드오프: 다른 프로바이더를 슬래시로 지목(예: /codex)하면, 현재 대화를 요약해 넘기고 그 프로바이더로 이어간다.
    // 셸(cmd) 세션이나 현재와 같은 프로바이더는 대상이 아니다.
    var HANDOFF_ALIASES = { claude: "claude", codex: "codex", agy: "antigravity", opencode: "opencode" };
    function startHandoff(to) {
      _handoffLock = true;                    // 이 세션의 모든 입력 차단(요약이 오염되지 않도록)
      inp.disabled = true; inp.value = ""; autoHeight();
      term.write("\r\n\x1b[36m[handoff] Summarizing this session and switching to " + to + "... (up to 3 min)\x1b[m\r\n");
      var q = "token=" + encodeURIComponent(token) + "&to=" + encodeURIComponent(to);
      if (storedToken) q += "&authToken=" + encodeURIComponent(storedToken);
      fetch(window.__CTX_PATH__ + "/cmd/handoff?" + q, { method: "POST" })
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (j.ok) {
            // 성공 시엔 이 세션이 종료되고 새 세션 프레임으로 전환되므로 락은 그대로 둔다.
            term.write("\r\n\x1b[32m[handoff] Ready. Opening " + to + " session...\x1b[m\r\n");
            sendToParent("terminal-handoff", { newToken: j.newToken, to: to });
          } else {
            _handoffLock = false;
            term.write("\r\n\x1b[31m[handoff] Failed: " + (j.msg || "unknown error") + "\x1b[m\r\n");
            inp.disabled = false; inp.focus();
          }
        })
        .catch(function (e) {
          _handoffLock = false;
          term.write("\r\n\x1b[31m[handoff] Error: " + e + "\x1b[m\r\n");
          inp.disabled = false; inp.focus();
        });
    }

    function sendInput() {
      if (disconnected) { disconnected = false; connect(); return; }
      var text = normalize(inp.value);
      if (text.trim() === "/super") { _toggleSuper(); inp.value = ""; autoHeight(); inp.focus(); return; }
      var _ht = inp.value.trim().toLowerCase();
      if (_ht.charAt(0) === "/" && HANDOFF_ALIASES.hasOwnProperty(_ht.slice(1))) {
        var _htTo = HANDOFF_ALIASES[_ht.slice(1)];
        if (_htTo !== MODE) { startHandoff(_htTo); return; }
      }
      if (text) {
        if (MODE === "gemini" || MODE === "antigravity") sendRaw("\x1b[200~" + text + "\x1b[201~");
        else sendRaw(text);
        if (text[0] !== "/") sendRaw("\r");
      } else sendRaw("\r");
      inp.value = ""; autoHeight(); inp.focus();
    }

    inp.addEventListener("keydown", function (e) {
      var items = _acItems();
      if (acBox.style.display !== "none" && items.length) {
        if (e.key === "ArrowDown") { e.preventDefault(); _acSelect(Math.min(_acIdx + 1, items.length - 1)); return; }
        if (e.key === "ArrowUp")   { e.preventDefault(); _acSelect(Math.max(_acIdx - 1, 0)); return; }
        if (e.key === "Tab")       { e.preventDefault(); _acApply(items[Math.max(_acIdx, 0)]._it); return; }
        if (e.key === "Escape")    { _acHide(); return; }
        if (e.key === "Enter" && !e.shiftKey && !e.isComposing && _acIdx >= 0) { e.preventDefault(); _acApply(items[_acIdx]._it); return; }
      }
      if (e.key === "Tab") { e.preventDefault(); sendToParent("terminal-tab-key"); return; }
      if (e.key === "Escape") { e.preventDefault(); sendEsc(); return; }
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendInput(); }
      if (!inp.value) { var a = { ArrowUp: "\x1b[A", ArrowDown: "\x1b[B", ArrowLeft: "\x1b[D", ArrowRight: "\x1b[C" }; if (a[e.key]) { e.preventDefault(); sendRaw(a[e.key]); } }
    });
    document.addEventListener("click", function (e) { if (!bar.contains(e.target)) _acHide(); });

    window.addEventListener("keydown", function (e) {
      if (e.key === "F6") { e.preventDefault(); e.stopPropagation(); _toggleSuper(); showBar(); inp.focus(); }
    }, true);

    _initSuper(); setInterval(function () { if (!document.hidden) _initSuper(); }, 60000);
    setTimeout(function () { inp.focus(); }, 300);
    setTimeout(sendResize, 800);

    if (MODE === "codex") {
      document.addEventListener("wheel", function (e) { e.preventDefault(); e.stopPropagation(); if (e.deltaY < 0) _codexUp(); else _codexDown(); }, { passive: false, capture: true });
    }
    document.addEventListener("wheel", function (e) { if (MODE !== "opencode" && MODE !== "grok") return; e.preventDefault(); e.stopPropagation(); sendRaw(e.deltaY < 0 ? "\x1b[5~" : "\x1b[6~"); }, { passive: false, capture: true });
    recvFromParent({ "focus-input": function () { showBar(); inp.focus(); } });
  }
})();
</script>
</body>
