<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Terminal</title>
<!--INJECT-->
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  #xt { position:fixed; top:0; left:0; right:0; bottom:0; }
  /* xterm 뷰포트의 네이티브 스크롤바가 모바일에서 폭을 잡아먹으므로 시각적으로만 숨긴다(스크롤 기능은 유지). */
  #xt .xterm-viewport { scrollbar-width: none; }
  #xt .xterm-viewport::-webkit-scrollbar { width: 0; height: 0; }
  #mi-bar { position:fixed;bottom:0;left:0;right:0;z-index:10000;display:flex;align-items:center;gap:8px;padding:6px 8px;border-top:1px solid #444;background:#1a1a1a;box-sizing:border-box; }
  #mi-bar textarea { flex:1;padding:5px 8px;background:#2a2a2a;border:1px solid #555;border-radius:4px;color:#fff;font-family:monospace;font-size:0.9rem;resize:none;line-height:1.4;max-height:200px;overflow-y:auto;min-width:0;box-sizing:border-box; }
  #mi-bar textarea:focus { outline:none;border-color:#00e5a0; }
  #mi-bar textarea.super, #mi-bar textarea.super:focus { border-color:#ff3b3b !important;background:#2a0e0e !important;color:#ff7a7a; }
  #mi-dd-btn { padding:5px 12px;background:#555;border:none;border-radius:4px;color:#fff;cursor:pointer;font-size:1.2rem;white-space:nowrap;line-height:1.4; }
  #mi-dd-btn:hover { background:#666; }
  #mi-dd-menu { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10001;width:max-content;min-width:0;max-width:calc(100vw - 16px);list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
  #mi-dd-menu.show { display:block; }
  .mi-item { display:block;width:100%;padding:6px 10px;background:none;border:none;color:#ddd;text-align:left;cursor:pointer;font-size:0.9rem;white-space:nowrap;box-sizing:border-box; }
  .mi-item:hover { background:#3a3a3a;color:#fff; }
  .mi-item.mi-active { color:#8ecbff;font-weight:600; }
  .mi-sep { height:1px;background:#444;margin:4px 0;list-style:none; }
  .mi-sub-wrap { position:relative; }
  .mi-sub-trigger { display:flex;justify-content:space-between;align-items:center; }
  .mi-submenu { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10002;width:max-content;min-width:0;max-width:calc(100vw - 16px);max-height:60vh;overflow-y:auto;list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
  .mi-submenu.show { display:block; }
  #mi-ac { display:none;position:fixed;background:#2a2a2a;border:1px solid #555;border-radius:4px;z-index:10002;max-height:40vh;overflow-y:auto;min-width:220px;list-style:none;margin:0;padding:4px 0;box-shadow:0 4px 12px rgba(0,0,0,.6); }
  .mi-ac-item { display:block;width:100%;padding:4px 12px;background:none;border:none;color:#ddd;text-align:left;cursor:pointer;font-family:monospace;font-size:0.85rem;white-space:nowrap;box-sizing:border-box; }
  .mi-ac-item:hover,.mi-ac-item.active { background:#3a3a3a;color:#fff; }
  /* 로그 오버레이: #xt 영역만 덮고 하단 입력바(#mi-bar z-index:10000)는 가리지 않음 */
  #mi-log { display:none;position:fixed;top:0;left:0;right:0;bottom:50px;z-index:5000;flex-direction:column;background:#0d0d0d;color:#e8e8e8;font-family:system-ui,sans-serif;box-sizing:border-box;overflow-y:auto;padding:10px;gap:8px; }
  #mi-log.show { display:flex; }
  #mi-log .mi-log-empty,#mi-log .mi-log-err { color:#888;font-size:0.85rem;padding:12px 4px; }
  #mi-log .mi-log-err { color:#f66; }
  .mi-log-row { display:flex; }
  .mi-log-row.user { justify-content:flex-end; }
  .mi-log-row.assistant,.mi-log-row.tool { justify-content:flex-start; }
  .mi-log-bubble { max-width:88%;padding:8px 10px;border-radius:8px;font-size:0.85rem;line-height:1.45;word-break:break-word; }
  .mi-log-row.user .mi-log-bubble { background:#1a4a7a;color:#eaf4ff; }
  .mi-log-row.assistant .mi-log-bubble { background:#2a2a2a;color:#e8e8e8;border:1px solid #3a3a3a; }
  .mi-log-row.tool .mi-log-bubble { max-width:95%;padding:5px 8px;background:#1c1c1c;color:#b8b8b8;border:1px dashed #444;font-size:0.8rem; }
  .mi-log-tool-name { font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#d4d4d4;font-weight:600; }
  .mi-log-bubble .mi-log-meta-line { font-size:0.68rem;opacity:0.7;margin-bottom:4px; }
  /* Control logRenderMarkdown 과 동일 패턴(escape→marked)용 본문 스타일 */
  .mi-log-bubble .mi-log-body { word-break:break-word; }
  .mi-log-bubble .mi-log-body p { margin:0.35em 0; }
  .mi-log-bubble .mi-log-body p:first-child { margin-top:0; }
  .mi-log-bubble .mi-log-body p:last-child { margin-bottom:0; }
  .mi-log-bubble .mi-log-body h1,.mi-log-bubble .mi-log-body h2,.mi-log-bubble .mi-log-body h3,
  .mi-log-bubble .mi-log-body h4,.mi-log-bubble .mi-log-body h5,.mi-log-bubble .mi-log-body h6 {
    margin:0.5em 0 0.3em;line-height:1.25;font-weight:600;
  }
  .mi-log-bubble .mi-log-body h1 { font-size:1.15em; }
  .mi-log-bubble .mi-log-body h2 { font-size:1.08em; }
  .mi-log-bubble .mi-log-body h3 { font-size:1.02em; }
  .mi-log-bubble .mi-log-body ul,.mi-log-bubble .mi-log-body ol { margin:0.35em 0;padding-left:1.4em; }
  .mi-log-bubble .mi-log-body pre {
    margin:0.4em 0;padding:8px;border-radius:4px;overflow-x:auto;
    background:rgba(0,0,0,.35);white-space:pre;font-family:ui-monospace,monospace;font-size:0.88em;
  }
  .mi-log-bubble .mi-log-body code {
    font-family:ui-monospace,monospace;font-size:0.9em;
    background:rgba(0,0,0,.25);padding:0.1em 0.35em;border-radius:3px;
  }
  .mi-log-bubble .mi-log-body pre code { background:none;padding:0;border-radius:0; }
  .mi-log-bubble .mi-log-body a,
  .mi-log-bubble .mi-log-body .mi-log-url,
  .mi-log-bubble .mi-log-body .mi-log-path {
    color:#7ec8ff;text-decoration:underline;cursor:pointer;word-break:break-all;
  }
  .mi-log-bubble .mi-log-body a:hover,
  .mi-log-bubble .mi-log-body .mi-log-url:hover,
  .mi-log-bubble .mi-log-body .mi-log-path:hover { color:#a8dcff; }
  .mi-log-bubble .mi-log-body blockquote {
    margin:0.4em 0;padding:0.2em 0.6em;border-left:3px solid #555;opacity:0.9;
  }
  .mi-log-bubble .mi-log-body table { border-collapse:collapse;margin:0.4em 0;font-size:0.9em; }
  .mi-log-bubble .mi-log-body th,.mi-log-bubble .mi-log-body td {
    border:1px solid #555;padding:3px 6px;
  }
</style>
</head>
<body>
<div id="xt"></div>
<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var token = params.get("token") || "";
  var MODE = window.__TERM_MODE;

  // 이 파일은 module이 아닌 일반 <script>이고, CTerminalRouter가 실제 파일 경로가 아니라
  // /cmd/terminal-proxy 같은 프록시 URL로 서빙하므로 상대경로 import("./CIframeMsg.js")는 404난다.
  // CAuthToken.js와 동일하게 서버가 주입한 __ARTGINE_BASE__ 기준 절대경로로 로드한다.
  var _iframeMsg = import(window.location.origin + window.__ARTGINE_BASE__ + "server/html/CIframeMsg.js");
  function sendToParent(type, data) {
    if (!window.parent) return;
    _iframeMsg.then(function (m) { m.CIframeMsg.Send(window.parent, type, data); });
  }
  function recvFromParent(handlers) {
    _iframeMsg.then(function (m) { m.CIframeMsg.Recv(handlers); });
  }

  // ---- xterm 인스턴스(직접 소유) ----
  var term = new Terminal({ cursorBlink: true, fontSize: 14, scrollback: 20000,
                            allowProposedApi: true,
                            theme: { background: "#000000" } });
  var fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  // 이모지 등 넓은 글자의 폭을 올바르게 계산(기본 유니코드6은 다수 이모지를 1칸으로 오판해 잘려 보임)
  term.loadAddon(new Unicode11Addon.Unicode11Addon());
  term.unicode.activeVersion = "11";
  term.open(document.getElementById("xt"));
  // xterm 코어는 스크롤바를 실측해 폭이 0이면(우리가 CSS로 숨겼으므로) "0 || FALLBACK_SCROLL_BAR_WIDTH"
  // 폴백(15px)에 걸려 스크롤바가 안 보여도 그 폭만큼 컬럼 계산에서 항상 빼버린다(우측에 빈 여백 발생).
  // FitAddon.fit() 호출마다 이 값을 0으로 되돌려 실제 폭을 온전히 컬럼 계산에 쓰게 한다.
  (function () {
    var origFit = fit.fit.bind(fit);
    fit.fit = function () { term._core.viewport.scrollBarWidth = 0; origFit(); };
  })();
  // webgl 렌더러: DOM 렌더러 대신 글리프를 텍스처로 정수 스냅 렌더링 → 행/셀 미세 간극 제거.
  // open() 이후에 로드해야 캔버스를 부착(실패 시 자동으로 DOM 렌더러 fallback).
  try { term.loadAddon(new WebglAddon.WebglAddon()); } catch (e) { console.warn("[terminal] webgl addon failed, fallback to DOM:", e); }
  // 출력의 URL을 클릭 가능한 링크로 인식(구 ttyd 웹클라이언트 기본 동작의 대체).
  term.loadAddon(new WebLinksAddon.WebLinksAddon(function (e, uri) { window.open(uri, "_blank", "noopener,noreferrer"); }));
  // xterm 코어의 링크 인식(Linkifier)은 mousemove로 호버를 추적한 뒤 mousedown/mouseup으로 활성화하는
  // 방식이라 호버가 없는 터치 디바이스에서는 동작하지 않는다. 탭 위치를 버퍼 좌표로 직접 변환해
  // WebLinksAddon과 동일한 URL 정규식으로 같은 줄에서 링크를 찾아 여는 터치 전용 보완 로직.
  (function () {
    var urlRegex = /(https?|HTTPS?):[/]{2}[^\s"'!*(){}|\\\^<>`]*[^\s"':,.!?{}|\\\^~\[\]`()<>]/g;
    // 드라이브 문자(D:\...)로 시작하는 절대경로 또는 슬래시/역슬래시가 섞인 상대경로(artgine\server\html\x.ts) 인식.
    // 확장자로 끝나는 경로만 매칭(디렉터리만 있는 문자열은 오탐 가능성이 커서 제외).
    var pathRegex = /(?:[A-Za-z]:[\\/])?(?:[^\s\\/:*?"<>|()\[\]]+[\\/])+[^\s\\/:*?"<>|()\[\]]+\.[A-Za-z0-9]+/g;
    var TAP_MOVE_TOLERANCE = 24; // px: 이보다 많이 움직이면 스크롤/드래그로 간주해 탭으로 취급하지 않음(터치 접촉 떨림 감안)

    // 탭/클릭 좌표(clientX/clientY)를 버퍼상의 (row, col)로 변환하고, 그 줄에서 URL/경로 매칭을 찾는다.
    function findTapMatch(clientX, clientY) {
      var core = term._core;
      var dims = core && core._renderService && core._renderService.dimensions;
      if (!dims) return null;
      var rect = term.element.getBoundingClientRect();
      var col = Math.floor((clientX - rect.left) / dims.css.cell.width);
      var row = Math.floor((clientY - rect.top) / dims.css.cell.height);
      var line = term.buffer.active.getLine(term.buffer.active.viewportY + row);
      if (!line) return null;
      var text = line.translateToString(true);
      urlRegex.lastIndex = 0;
      var m;
      while ((m = urlRegex.exec(text))) {
        if (col >= m.index && col < m.index + m[0].length) return { type: "url", text: m[0] };
      }
      pathRegex.lastIndex = 0;
      while ((m = pathRegex.exec(text))) {
        if (col >= m.index && col < m.index + m[0].length) return { type: "path", text: m[0] };
      }
      return null;
    }

    function handleTapMatch(match) {
      if (!match) return;
      if (match.type === "url") window.open(match.text, "_blank", "noopener,noreferrer");
      else if (match.type === "path") sendToParent("terminal-path-tapped", { path: match.text, token: token });
    }

    // 호버가 없는 터치 디바이스에서는 xterm 코어의 링크 인식(mousemove로 호버 추적 후 mousedown/mouseup으로
    // 활성화)이 동작하지 않으므로 탭 위치를 버퍼 좌표로 직접 변환하는 터치 전용 보완 로직.
    var touchStart = null;
    term.element.addEventListener("touchstart", function (e) {
      var t = e.touches[0];
      touchStart = { x: t.clientX, y: t.clientY };
    }, { passive: true });
    term.element.addEventListener("touchend", function (e) {
      var start = touchStart;
      touchStart = null;
      if (!start || !e.changedTouches.length) return;
      var t = e.changedTouches[0];
      if (Math.hypot(t.clientX - start.x, t.clientY - start.y) > TAP_MOVE_TOLERANCE) return;
      handleTapMatch(findTapMatch(t.clientX, t.clientY));
    }, { passive: true });

    // 마우스: URL은 WebLinksAddon이 코어 Linkifier(호버 밑줄+클릭 활성화)로 처리하지만,
    // WebLinksAddon은 매칭된 텍스트가 유효한 URL로 파싱될 때만 링크로 인정하므로 경로 문자열은
    // 걸러진다. 그래서 경로 전용 커스텀 링크 프로바이더를 등록해 같은 호버 밑줄/클릭 동작을 재현한다.
    term.registerLinkProvider({
      provideLinks: function (bufferLineNumber, callback) {
        var line = term.buffer.active.getLine(bufferLineNumber - 1);
        if (!line) { callback(undefined); return; }
        var text = line.translateToString(true);
        urlRegex.lastIndex = 0;
        var urlRanges = [];
        var um;
        while ((um = urlRegex.exec(text))) urlRanges.push([um.index, um.index + um[0].length]);
        pathRegex.lastIndex = 0;
        var links = [];
        var m;
        while ((m = pathRegex.exec(text))) {
          var s = m.index, e = m.index + m[0].length;
          // URL과 겹치는 구간은 WebLinksAddon이 이미 링크로 처리하므로 중복 등록하지 않는다.
          if (urlRanges.some(function (r) { return s < r[1] && e > r[0]; })) continue;
          links.push({
            text: m[0],
            range: { start: { x: s + 1, y: bufferLineNumber }, end: { x: e, y: bufferLineNumber } },
            activate: function (_e, linkText) { sendToParent("terminal-path-tapped", { path: linkText, token: token }); },
          });
        }
        callback(links.length ? links : undefined);
      }
    });
  })();
  fit.fit();
  window.term = term; // 하위 호환(외부 스크립트가 참조)

  var ws = null;
  var disconnected = false;
  // 로그 패널(마크다운 모드)은 buildInputBar 안에서만 존재하므로(읽기전용 뷰어는 buildInputBar 자체가
  // 안 불린다), 실제 구현은 buildInputBar가 이 변수에 덮어씌운다. connect()의 ws.onmessage는 바깥
  // 스코프라 buildInputBar 안의 함수 선언을 직접 볼 수 없어서 이렇게 바깥에 자리를 만들어둔다.
  var _onSessionStatus = function () {};
  // 핸드오프 진행 중에는 이 세션의 모든 입력을 막는다(리드모드처럼). 하단 입력창뿐 아니라
  // xterm 화면 직접 입력(term.onData)·메뉴·방향키가 전부 sendRaw를 거치므로 여기서 한 번에 차단한다.
  var _handoffLock = false;
  // Control이 숨긴 터미널 iframe을 0x0 idle 풀로 옮기면 window.resize가 뛰고
  // fit()이 2x1 등으로 줄어 PTY가 극소가 된다.
  // antigravity: ToolConfirmation.View nil 패닉으로 프로세스 종료.
  // grok: 프로세스는 살아 있어도 alt-screen/승인 메뉴가 깨져 턴이 멈춘 것처럼 보인다
  //   (서버 headless도 같이 줄면 isGrokPermissionMenu가 메뉴를 못 읽어 자동승인도 멈춤).
  var _frameVisible = true;
  var MIN_TERM_COLS = 20;
  var MIN_TERM_ROWS = 5;
  function sendRaw(text) {
    if (_handoffLock || !_frameVisible) return;
    if (ws && ws.readyState === 1) ws.send(text);
  }
  // grok은 ESC를 취소로 받지 않아 Ctrl+C를 대신 보낸다(다른 CLI의 ESC와 같은 결과).
  function sendEsc() { sendRaw(MODE === "grok" ? "\x03" : "\x1b"); }
  function sendResize() {
    if (!_frameVisible) return;
    // frame-visibility postMessage보다 resize가 먼저 올 수 있다. fit() 전에
    // 실제 뷰포트가 극소면 로컬 xterm조차 줄이지 않는다(grok 화면이 깨져 보임).
    if (window.innerWidth < 160 || window.innerHeight < 80) return;
    fit.fit();
    if (term.cols < MIN_TERM_COLS || term.rows < MIN_TERM_ROWS) return;
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ type: "resize", cols: term.cols, rows: term.rows }));
  }
  recvFromParent({
    "frame-visibility": function (data) {
      _frameVisible = !!(data && data.visible);
      if (_frameVisible) sendResize();
    }
  });

  // codex/opencode scroll emulation (우리 term 사용)
  var _scrollDepth = 0;
  function _codexUp()   { var p = _scrollDepth++; sendRaw("\x1b[A"); if (p === 0) sendRaw("\x14"); }
  function _codexDown() { var p = _scrollDepth; if (_scrollDepth > 0) _scrollDepth--; sendRaw("\x1b[B"); if (p === 1 && _scrollDepth === 0) sendRaw("\x14"); }

  // xterm 화면(#xt) 자체에 포커스가 있을 때도 Tab은 항상 부모(Home)로 전달해 사이드바를 토글한다.
  // (하단 입력창 inp에 포커스가 있을 때의 Tab 처리는 buildInputBar 안의 별도 리스너가 담당)
  term.attachCustomKeyEventHandler(function (e) {
    if (e.type !== "keydown") return true;
    if (e.key === "Tab") { e.preventDefault(); sendToParent("terminal-tab-key"); return false; }
    if (MODE === "codex") {
      if (e.key === "PageUp")   { _codexUp();   return false; }
      if (e.key === "PageDown") { _codexDown(); return false; }
    }
    return true;
  });

  function connect() {
    var pr = window.location.protocol === "https:" ? "wss:" : "ws:";
    // 인증: 로컬(same-origin)은 세션 쿠키(서버 isAuthedUpgrade)로, 원격(cross-origin iframe)은 서드파티 쿠키가
    // 막히므로 서버가 주입한 __AUTH_TOKEN__을 &authToken= 으로 실어 인증한다. token은 세션 식별용.
    var url = pr + "//" + window.location.host + window.__CTX_PATH__ + "/cmd/term-ws?token=" + encodeURIComponent(token);
    if (window.__AUTH_TOKEN__) url += "&authToken=" + encodeURIComponent(window.__AUTH_TOKEN__);
    ws = new WebSocket(url);
    ws.binaryType = "arraybuffer";
    ws.onopen = function () { disconnected = false; sendResize(); };
    ws.onmessage = function (ev) {
      if (typeof ev.data === "string") { term.write(ev.data); return; }
      // 바이너리 프레임 = 상태 컨트롤 메시지(서버 CTerminalRouter _pushStatus). 원본 pty 출력은
      // 항상 텍스트 프레임으로 오므로 이 분기와 절대 섞이지 않는다.
      try {
        var msg = JSON.parse(new TextDecoder("utf-8").decode(ev.data));
        if (msg && msg.type === "status") _onSessionStatus(msg.status);
      } catch (e) {}
    };
    ws.onclose = function () { disconnected = true; term.write("\r\n\x1b[31m[disconnected] retry: Enter\x1b[m\r\n"); };
  }

  // ---- 읽기전용 판정: 저장 토큰 유무(원본 Terminal.html과 동일 소스) ----
  var _authTokenMod = null;
  var _hashMod = null;
  function _webRootUrl() {
    var seg = window.location.pathname.split("/")[1] || "";
    return window.location.protocol + "//" + window.location.host + "/" + seg + "/";
  }
  // 로그인 바(단독/공유링크 접속)에서 서버가 기대하는 SHA256('artgine_'+pw) 해시를 만들려면 CHash도 필요하다.
  var _ready = Promise.all([
    import(window.location.origin + window.__ARTGINE_BASE__ + "server/CAuthToken.js")
      .then(function (m) { _authTokenMod = m; }),
    import(window.location.origin + window.__ARTGINE_BASE__ + "basic/CHash.js")
      .then(function (m) { _hashMod = m; })
  ]).catch(function (e) { console.error("[terminal] auth module load failed:", e); });

  window.addEventListener("DOMContentLoaded", async function () {
    await _ready;
    // 원격 iframe은 서버가 주입한 __AUTH_TOKEN__을 우선 쓴다(로컬 오리진 localStorage엔 원격 토큰이 없으므로).
    var storedToken = window.__AUTH_TOKEN__ || (_authTokenMod ? _authTokenMod.getAuthToken(_webRootUrl()) : "");
    var readOnly = !storedToken;
    window.__READ_ONLY = readOnly;

    term.onData(function (d) {
      if (disconnected) { if (d === "\r") { disconnected = false; connect(); } return; }
      if (!readOnly) sendRaw(d);
    });
    window.addEventListener("resize", sendResize);
    connect();

    if (readOnly) { buildLoginBar(); return; }
    buildInputBar(storedToken);
  });

  // ---- 읽기전용: 로그인 바 ----
  function buildLoginBar() {
    var bar = document.createElement("div"); bar.id = "mi-bar";
    var pw = document.createElement("input"); pw.type = "password"; pw.placeholder = "Password";
    pw.style.cssText = "flex:1;padding:5px 8px;background:#2a2a2a;border:1px solid #555;border-radius:4px;color:#fff;font-size:0.9rem;min-width:0;";
    var msg = document.createElement("span"); msg.style.cssText = "color:#f55;font-size:0.8rem;white-space:nowrap;";
    var btn = document.createElement("button"); btn.textContent = "Login";
    btn.style.cssText = "padding:5px 14px;background:#0d6efd;border:none;border-radius:4px;color:#fff;cursor:pointer;white-space:nowrap;";
    bar.appendChild(pw); bar.appendChild(msg); bar.appendChild(btn);
    document.body.appendChild(bar);
    function doAuth() {
      if (!pw.value) return;
      // 서버(handleAuth)는 SHA256('artgine_'+pw) 해시를 기대한다 — 날것 그대로 보내면 항상 "틀린 암호"가 된다
      // (Control/Chat/Browser는 모두 이 해시를 보낸다).
      if (!_hashMod || !_authTokenMod) { msg.textContent = "Loading..."; return; }
      btn.disabled = true; msg.textContent = "";
      // authLogin은 서버에 2차 인증이 켜져 있으면 메신저 승인까지 기다린 뒤에 반환한다.
      _authTokenMod.authLogin(window.__CTX_PATH__, _hashMod.CHash.SHA256('artgine_' + pw.value), function () {
        msg.style.color = "#aaa"; msg.textContent = "Waiting for messenger approval...";
      }).then(function (j) {
        msg.style.color = "#f55";
        if (j.ok) { _authTokenMod.setAuthToken(_webRootUrl(), j.token); location.reload(); }
        else { msg.textContent = j.msg || "Wrong password"; btn.disabled = false; pw.value = ""; pw.focus(); }
      }).catch(function () { msg.style.color = "#f55"; msg.textContent = "Connection failed"; btn.disabled = false; });
    }
    btn.addEventListener("click", doAuth);
    pw.addEventListener("keydown", function (e) { if (e.key === "Enter") doAuth(); });
  }

  // ---- 쓰기: 입력 바 + 메뉴 (원본 Terminal.html 포팅, sendRaw만 교체) ----
  function buildInputBar(storedToken) {
    var bar = document.createElement("div"); bar.id = "mi-bar";
    var inp = document.createElement("textarea"); inp.rows = 1; inp.placeholder = "Type then Enter...";
    inp.autocomplete = "off"; inp.autocorrect = "off"; inp.autocapitalize = "off"; inp.spellcheck = false;
    var ddWrap = document.createElement("div"); ddWrap.style.position = "relative";
    var ddBtn = document.createElement("button"); ddBtn.id = "mi-dd-btn"; ddBtn.textContent = "⌨";
    var ddMenu = document.createElement("ul"); ddMenu.id = "mi-dd-menu";

    function showBar() {
      bar.style.display = "flex";
      if (typeof _logSyncBottom === "function") _logSyncBottom();
    }
    function hideBar() {
      bar.style.display = "none";
      if (typeof _logSyncBottom === "function") _logSyncBottom();
    }
    function autoHeight() {
      inp.style.height = "0"; inp.style.height = Math.min(inp.scrollHeight, 200) + "px";
      if (typeof _logSyncBottom === "function") _logSyncBottom();
    }

    // super mode
    var _superOn = false;
    function _superUrl(extra) {
      var q = "token=" + encodeURIComponent(token);
      if (storedToken) q += "&authToken=" + encodeURIComponent(storedToken);
      return window.__CTX_PATH__ + "/cmd/super-mode?" + q + (extra || "");
    }
    function _setSuper(on) { _superOn = !!on; inp.classList.toggle("super", _superOn); }
    function _toggleSuper() { fetch(_superUrl("&on=" + (_superOn ? "0" : "1"))).then(function (r) { return r.json(); }).then(function (j) { if (j.ok) _setSuper(j.super); }); }
    function _initSuper() { fetch(_superUrl()).then(function (r) { return r.json(); }).then(function (j) { if (j.ok) _setSuper(j.super); }).catch(function () {}); }

    function _pageUp()    { if (MODE === "codex") { _codexUp(); return; } sendRaw("\x1b[5~"); }
    function _pageDown()  { if (MODE === "codex") { _codexDown(); return; } sendRaw("\x1b[6~"); }

    function agentAction(kind) {
      _forceTerminalView();
      if (kind === "resume")  { if (MODE === "claude" || MODE === "codex" || MODE === "antigravity" || MODE === "grok") return sendRaw("/resume\r"); if (MODE === "gemini") return sendRaw("/chat resume\r"); if (MODE === "opencode") return sendRaw("/sessions\r"); }
      if (kind === "compact") { if (MODE === "claude" || MODE === "gemini" || MODE === "codex") return sendRaw("/compact\r"); }
      if (kind === "exit")    { if (MODE === "codex") return sendRaw("\x04"); if (MODE === "claude" || MODE === "gemini") return sendRaw("/exit\r"); }
      if (kind === "clear")   { if (MODE === "cmd") return sendRaw("cls\r"); return sendRaw("/clear\r"); }
      if (kind === "status")  { if (MODE === "gemini") return sendRaw("/stats\r"); if (MODE === "antigravity") return sendRaw("/usage\r"); if (MODE === "cmd") return; sendRaw("/status\r"); }
    }

    function closeSubs() { ddMenu.querySelectorAll(".mi-submenu").forEach(function (m) { m.classList.remove("show"); }); }
    ddBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      var open = ddMenu.classList.contains("show"); closeSubs();
      if (open) ddMenu.classList.remove("show");
      else { var r = ddBtn.getBoundingClientRect(); ddMenu.style.bottom = (window.innerHeight - r.top + 4) + "px"; ddMenu.style.right = (window.innerWidth - r.right) + "px"; ddMenu.classList.add("show"); }
    });
    document.addEventListener("click", function () { ddMenu.classList.remove("show"); closeSubs(); });

    // ---- 세션 로그 오버레이 (#xt 위, 입력바는 유지 / 상단 헤더 없음) ----
    // afterId=-1 전체 로드 후, 폴링은 afterId=maxId 로 증분만 받아 append.
    // 마크다운: Control 로그와 동일 — escape 후 marked.parse (XSS 방지).
    var logPanel = document.createElement("div"); logPanel.id = "mi-log";
    logPanel.innerHTML = '<div class="mi-log-empty">Loading...</div>';
    document.body.appendChild(logPanel);
    var _logOpen = false;
    var _logTimer = null;
    var _logMaxId = -1;     // 마지막으로 반영한 최대 id → 다음 폴링 afterId
    var _logFetchBusy = false;
    var _logHasRows = false; // empty 플레이스홀더 여부
    var LOG_POLL_MS = 2000;
    var _marked = null;
    var _markedReady = null;

    function _logEsc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }
    function _logFmtTime(stamp) {
      var s = String(stamp || "");
      if (s.length < 14) return s;
      return s.slice(0, 4) + "-" + s.slice(4, 6) + "-" + s.slice(6, 8) + " " + s.slice(8, 10) + ":" + s.slice(10, 12);
    }
    function _logSyncBottom() {
      // 터미널(#xt)은 더 이상 입력바 몫으로 공간을 미리 비워두지 않으므로(입력바가 위에 그냥 덮어씀),
      // 로그 패널은 입력바 실제 높이(멀티라인 포함)를 직접 읽어 그 위에 맞춘다.
      logPanel.style.bottom = (bar.style.display === "none" ? 0 : bar.offsetHeight) + "px";
    }
    // Control.ts: marked.parse(aiEscapeHtml(raw), { xhtml: false })
    function _logEnsureMarked() {
      if (_marked) return Promise.resolve(_marked);
      if (!_markedReady) {
        var url = window.location.origin + window.__ARTGINE_BASE__ + "external/esnext/md/marked.esm.js";
        _markedReady = import(url).then(function (m) {
          var marked = m.marked || m.default;
          if (marked && marked.setOptions) marked.setOptions({ gfm: true, breaks: true });
          _marked = marked;
          return marked;
        }).catch(function (e) {
          console.warn("[terminal] marked load failed:", e);
          _marked = null;
          return null;
        });
      }
      return _markedReady;
    }
    function _logMd(raw) {
      var text = (raw || "").trim();
      var escaped = _logEsc(text);
      if (!_marked) return escaped;
      try {
        return _marked.parse(escaped, { xhtml: false });
      } catch (e) {
        return escaped;
      }
    }
    // xterm 경로/URL 인식과 동일 정규식 — 로그 본문 평문에서도 클릭 가능하게 후처리
    var _logUrlRe = /(https?|HTTPS?):[/]{2}[^\s"'!*(){}|\\\^<>`]*[^\s"':,.!?{}|\\\^~\[\]`()<>]/g;
    var _logPathRe = /(?:[A-Za-z]:[\\/])?(?:[^\s\\/:*?"<>|()\[\]]+[\\/])+[^\s\\/:*?"<>|()\[\]]+\.[A-Za-z0-9]+/g;

    function _logCollectMatches(text) {
      var out = [];
      var m;
      _logUrlRe.lastIndex = 0;
      while ((m = _logUrlRe.exec(text))) out.push({ type: "url", start: m.index, end: m.index + m[0].length, text: m[0] });
      _logPathRe.lastIndex = 0;
      while ((m = _logPathRe.exec(text))) {
        var s = m.index, e = m.index + m[0].length;
        // URL 구간과 겹치면 경로로 등록하지 않음
        if (out.some(function (u) { return u.type === "url" && s < u.end && e > u.start; })) continue;
        out.push({ type: "path", start: s, end: e, text: m[0] });
      }
      out.sort(function (a, b) { return a.start - b.start; });
      // 겹침 제거(앞 매치 우선)
      var cleaned = [];
      var lastEnd = 0;
      for (var i = 0; i < out.length; i++) {
        if (out[i].start < lastEnd) continue;
        cleaned.push(out[i]);
        lastEnd = out[i].end;
      }
      return cleaned;
    }

    function _logLinkifyTextNode(node) {
      var text = node.nodeValue;
      if (!text || !text.trim()) return;
      var matches = _logCollectMatches(text);
      if (!matches.length) return;
      var frag = document.createDocumentFragment();
      var last = 0;
      for (var i = 0; i < matches.length; i++) {
        var mt = matches[i];
        if (mt.start > last) frag.appendChild(document.createTextNode(text.slice(last, mt.start)));
        if (mt.type === "url") {
          var a = document.createElement("a");
          a.className = "mi-log-url";
          a.href = mt.text;
          a.target = "_blank";
          a.rel = "noopener noreferrer";
          a.textContent = mt.text;
          frag.appendChild(a);
        } else {
          var sp = document.createElement("span");
          sp.className = "mi-log-path";
          sp.setAttribute("data-path", mt.text);
          sp.textContent = mt.text;
          frag.appendChild(sp);
        }
        last = mt.end;
      }
      if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
      node.parentNode.replaceChild(frag, node);
    }

    // marked 출력 후: 기존 <a> 정리 + 평문 URL/경로 링크화 (터미널 탭과 동일 UX)
    function _logEnhanceRoot(root) {
      if (!root) return;
      root.querySelectorAll("a[href]").forEach(function (a) {
        var href = a.getAttribute("href") || "";
        if (/^https?:\/\//i.test(href)) {
          a.setAttribute("target", "_blank");
          a.setAttribute("rel", "noopener noreferrer");
          a.classList.add("mi-log-url");
        } else {
          // 파일 경로 링크 등: Control 경로 탭으로
          var p = (a.textContent || href).trim();
          if (p) {
            a.classList.add("mi-log-path");
            a.setAttribute("data-path", p);
            a.removeAttribute("href");
            a.setAttribute("role", "link");
          }
        }
      });
      var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null);
      var nodes = [];
      var n;
      while ((n = walker.nextNode())) nodes.push(n);
      for (var i = 0; i < nodes.length; i++) {
        var node = nodes[i];
        var pe = node.parentElement;
        if (!pe) continue;
        if (pe.closest("a, .mi-log-url, .mi-log-path, .mi-log-meta-line")) continue;
        _logLinkifyTextNode(node);
      }
    }

    // 클릭 위임: URL → 새 탭, 경로 → 부모 Control에 terminal-path-tapped (터미널 본문과 동일)
    logPanel.addEventListener("click", function (e) {
      var pathEl = e.target.closest && e.target.closest(".mi-log-path");
      if (pathEl) {
        e.preventDefault();
        e.stopPropagation();
        var p = pathEl.getAttribute("data-path") || (pathEl.textContent || "").trim();
        if (p) sendToParent("terminal-path-tapped", { path: p, token: token });
        return;
      }
      var a = e.target.closest && e.target.closest("a.mi-log-url, a[href]");
      if (a) {
        var href = a.getAttribute("href") || "";
        if (/^https?:\/\//i.test(href)) {
          e.preventDefault();
          e.stopPropagation();
          window.open(href, "_blank", "noopener,noreferrer");
        }
      }
    });

    function _logBubbleHtml(rec) {
      var head = _logEsc(rec.provider || "") + " · " + _logEsc(_logFmtTime(rec.createdAt));
      if (rec.model) head += " · " + _logEsc(rec.model);
      if (rec.sessionId) head += " · " + _logEsc(String(rec.sessionId).slice(0, 12));
      if (rec.role === "tool") {
        var toolName = _logEsc((rec.tool || "?").trim() || "?");
        var filePath = (rec.file || "").trim();
        var body = '<span class="mi-log-tool-name">' + toolName + "</span>";
        if (filePath) body += ' <span class="mi-log-path" data-path="' + _logEsc(filePath) + '">' + _logEsc(filePath) + "</span>";
        return '<div class="mi-log-row tool"><div class="mi-log-bubble mi-log-tool">' +
          '<div class="mi-log-meta-line">' + head + " · tool</div>" +
          '<div class="mi-log-body">' + body + "</div>" +
          "</div></div>";
      }
      var role = rec.role === "user" ? "user" : "assistant";
      return '<div class="mi-log-row ' + role + '"><div class="mi-log-bubble">' +
        '<div class="mi-log-meta-line">' + head + "</div>" +
        '<div class="mi-log-body">' + _logMd(rec.text) + "</div>" +
        "</div></div>";
    }
    function _logRenderFull(records) {
      if (!records || !records.length) {
        _logHasRows = false;
        logPanel.innerHTML = '<div class="mi-log-empty">No conversation logs for this terminal yet.' +
          (MODE === "cmd" ? " (cmd mode has no provider transcript.)" : "") + "</div>";
        return;
      }
      _logHasRows = true;
      var html = "";
      for (var i = 0; i < records.length; i++) html += _logBubbleHtml(records[i]);
      logPanel.innerHTML = html;
      _logEnhanceRoot(logPanel);
      logPanel.scrollTop = logPanel.scrollHeight;
    }
    // 증분 레코드만 하단에 붙인다. 빈 화면이었으면 empty 문구를 지운다.
    function _logAppend(records) {
      if (!records || !records.length) return;
      var nearBottom = (logPanel.scrollHeight - logPanel.scrollTop - logPanel.clientHeight) < 80;
      if (!_logHasRows) {
        logPanel.innerHTML = "";
        _logHasRows = true;
      }
      var wrap = document.createElement("div");
      var frag = "";
      for (var i = 0; i < records.length; i++) frag += _logBubbleHtml(records[i]);
      wrap.innerHTML = frag;
      _logEnhanceRoot(wrap);
      while (wrap.firstChild) logPanel.appendChild(wrap.firstChild);
      if (nearBottom) logPanel.scrollTop = logPanel.scrollHeight;
    }
    // silent=true: 폴링(afterId=maxId 증분). false: 첫 로드(afterId=-1 전체).
    function _logLoad(silent) {
      if (_logFetchBusy) return;
      _logFetchBusy = true;
      if (!silent) logPanel.innerHTML = '<div class="mi-log-empty">Loading...</div>';
      var afterId = silent ? _logMaxId : -1;
      // 폴링인데 아직 첫 로드 전이면 전체 로드로 폴백
      if (silent && afterId < 0) afterId = -1;
      var q = "token=" + encodeURIComponent(token) + "&afterId=" + encodeURIComponent(String(afterId));
      if (storedToken) q += "&authToken=" + encodeURIComponent(storedToken);
      fetch(window.__CTX_PATH__ + "/cmd/log-term?" + q)
        .then(function (r) {
          var ct = (r.headers.get("content-type") || "");
          if (!r.ok || ct.indexOf("json") < 0) {
            return r.text().then(function (t) {
              throw new Error(r.ok ? "Non-JSON response" : ("HTTP " + r.status + (t ? ": " + t.slice(0, 80) : "")));
            });
          }
          return r.json();
        })
        .then(function (j) {
          if (!_logOpen) return;
          if (!j.ok) {
            if (!silent) logPanel.innerHTML = '<div class="mi-log-err">' + _logEsc(j.msg || "Failed to load logs") + "</div>";
            return;
          }
          var records = j.records || [];
          var serverMax = typeof j.maxId === "number" ? j.maxId : _logMaxId;
          return _logEnsureMarked().then(function () {
            if (!_logOpen) return;
            if (!silent || afterId < 0) {
              _logRenderFull(records);
              _logMaxId = serverMax > 0 ? serverMax : _logMaxId;
              return;
            }
            // 증분: 새 row 없으면 스킵, 있으면 append 후 커서 갱신
            if (!records.length) return;
            _logAppend(records);
            if (serverMax > _logMaxId) _logMaxId = serverMax;
          });
        })
        .catch(function (e) {
          if (!_logOpen) return;
          if (!silent) logPanel.innerHTML = '<div class="mi-log-err">' + _logEsc(e && e.message ? e.message : String(e)) + "</div>";
        })
        .then(function () { _logFetchBusy = false; });
    }
    function _logStartPoll() {
      _logStopPoll();
      _logTimer = setInterval(function () {
        if (!_logOpen || document.hidden) return;
        _logLoad(true);
      }, LOG_POLL_MS);
    }
    function _logStopPoll() {
      if (_logTimer) { clearInterval(_logTimer); _logTimer = null; }
    }
    function _logUpdateBtns() {
      ddMenu.querySelectorAll("[data-log-view]").forEach(function (b) {
        var isMd = b.getAttribute("data-log-view") === "md";
        b.classList.toggle("mi-active", isMd === _logOpen);
      });
    }
    function _logShow() {
      _logOpen = true;
      _logMaxId = -1;
      _logHasRows = false;
      _logSyncBottom();
      logPanel.classList.add("show");
      _logUpdateBtns();
      _logLoad(false);
      _logStartPoll();
    }
    function _logHide() {
      _logOpen = false;
      _logStopPoll();
      logPanel.classList.remove("show");
      _logUpdateBtns();
    }
    function _logToggle() {
      if (_logOpen) _logHide();
      else _logShow();
    }

    // 마크다운(로그) 모드로 보고 있는 도중 권한 승인 대기가 뜨면 잠깐 터미널 화면으로 전환해 실제
    // 프롬프트를 보여주고, 화면이 조용해지면(status: idle) 원래 보던 마크다운 모드로 되돌린다.
    // 사용자가 그 사이 직접 버튼으로 전환하면(_logShow/_logHide 수동 호출) autoSwitchedAway를 꺼서
    // 자동 복귀가 사용자 선택을 덮어쓰지 않게 한다.
    var _autoSwitchedAway = false;
    function _switchToTerminalForPermission() {

      // 원격 터미널은 부모와 오리진이 달라 부모가 이 iframe에 직접 keydown 리스너를 붙일 수 없어서
      // (cross-origin 접근 제한) postMessage로 알려주는 이 방식이 유일한 전달 수단이다. F1/F2/F4는 Shift
      // 여부로 동작이 갈리므로(사이드바 보이기/강제 숨기기) shift도 함께 보낸다.
      if (e.key === "F1" || e.key === "F2" || e.key === "F3" || e.key === "F4") {
        e.preventDefault(); e.stopPropagation();
        sendToParent("home-hotkey", { key: e.key, shift: e.shiftKey });
      }
    }, true);

    _initSuper(); setInterval(function () { if (!document.hidden) _initSuper(); }, 60000);
    setTimeout(function () { inp.focus(); }, 300);
    setTimeout(sendResize, 800);

    // 로그 패널이 열려 있으면 터미널용 휠/터치 가로채기를 끄고 #mi-log 네이티브 스크롤을 살린다.
    if (MODE === "codex") {
      document.addEventListener("wheel", function (e) {
        if (_logOpen) return;
        e.preventDefault(); e.stopPropagation();
        if (e.deltaY < 0) _codexUp(); else _codexDown();
      }, { passive: false, capture: true });
    }
    document.addEventListener("wheel", function (e) {
      if (_logOpen) return;
      if (MODE !== "opencode" && MODE !== "grok") return;
      e.preventDefault(); e.stopPropagation();
      sendRaw(e.deltaY < 0 ? "\x1b[5~" : "\x1b[6~");
    }, { passive: false, capture: true });
    // codex/opencode/grok처럼 휠을 통째로 가로채지 않는 나머지 모드(claude 등)에서, xterm 내장
    // 자동 하단 추적(BufferService.isUserScrolling)이 풀리지 않고 멈추는 경우가 있다. 원인: 네이티브
    // 스크롤(휠/터치/스크롤바 드래그 전부 공통)은 Viewport._handleScroll이 scrollTop을 행높이로 나눠
    // Math.round()한 값으로 목표 줄을 계산하는데, WebGL 렌더러/서브픽셀 스크롤 오차로 스크롤바를 끝까지
    // 내려도 그 반올림 결과가 ybase보다 1 작게 나오면 isUserScrolling이 false로 안 풀려 그대로 정지한다.
    // (드롭다운 "Scroll to bottom"의 term.scrollToBottom()은 반올림 없이 ybase-ydisp를 직접 계산해서
    // 항상 풀리므로 수동으로 그걸 누르면 해결되던 것과 동일한 현상.) 아래는 휠 이벤트 하나에만 반응하던
    // 기존 방식(스크롤 위치와 무관하게 아래로 휠만 굴리면 무조건 맨 아래로 점프해 히스토리 탐색을 방해함)
    // 대신, 휠/터치/스크롤바 드래그가 전부 거치는 .xterm-viewport 자체의 네이티브 scroll 이벤트를 보고
    // "실제로 맨 아래 근처(셀 1개 높이 이내)까지 도달했을 때만" scrollToBottom()으로 오차 없이 스냅한다.
    // scrollToBottom()은 이미 맨 아래면 조기 반환하므로 반복 호출에 의한 루프/튐은 없다.
    var _xtViewportEl = term.element.querySelector(".xterm-viewport");
    if (_xtViewportEl) {
      _xtViewportEl.addEventListener("scroll", function () {
        if (_logOpen) return;
        if (MODE === "codex" || MODE === "opencode" || MODE === "grok") return;
        var dims = term._core && term._core._renderService && term._core._renderService.dimensions;
        var rowH = (dims && dims.css && dims.css.cell && dims.css.cell.height) || 16;
        var maxScrollTop = _xtViewportEl.scrollHeight - _xtViewportEl.clientHeight;
        if (maxScrollTop - _xtViewportEl.scrollTop <= rowH) term.scrollToBottom();
      }, { passive: true });
    }

    // 모바일 터치 드래그는 wheel 이벤트를 발생시키지 않아 위 wheel 가로채기가 무력화된다.
    // codex/opencode/grok은 스크롤백이 없는 alt-screen 앱이라 xterm 내장 터치 스크롤(handleTouchStart/Move,
    // xterm.js 코어가 자체 등록)이 동작해도 의미가 없으므로, wheel과 동일하게 document 캡처 단계에서
    // stopPropagation으로 xterm 내장 리스너(버블 단계, non-capture)에 도달하기 전에 가로채 PageUp/Down으로 치환한다.
    // claude/antigravity 등 나머지 모드는 이 블록 자체를 안 타므로 xterm 기본 터치 스크롤이 그대로 동작한다.
    if (MODE === "codex" || MODE === "opencode" || MODE === "grok") {
      var _touchY = null, _touchAccum = 0;
      var TOUCH_SCROLL_STEP = 40; // px: wheel 한 노치에 대응하는 드래그 거리
      document.addEventListener("touchstart", function (e) {
        if (_logOpen) { _touchY = null; return; }
        if (e.touches.length !== 1) { _touchY = null; return; }
        _touchY = e.touches[0].clientY;
        _touchAccum = 0;
      }, { passive: true, capture: true });
      document.addEventListener("touchmove", function (e) {
        if (_logOpen) return;   // preventDefault 하지 않음 → 로그 패널 터치 스크롤
        if (_touchY == null || e.touches.length !== 1) return;
        var y = e.touches[0].clientY;
        var dy = y - _touchY;
        _touchY = y;
        _touchAccum += dy;
        while (_touchAccum >= TOUCH_SCROLL_STEP) { _touchAccum -= TOUCH_SCROLL_STEP; _pageUp(); }
        while (_touchAccum <= -TOUCH_SCROLL_STEP) { _touchAccum += TOUCH_SCROLL_STEP; _pageDown(); }
        e.preventDefault(); e.stopPropagation();
      }, { passive: false, capture: true });
      document.addEventListener("touchend", function () { _touchY = null; _touchAccum = 0; }, { passive: true, capture: true });
    }
    recvFromParent({ "focus-input": function () { showBar(); inp.focus(); } });
  }
})();
</script>
</body>
</html>
