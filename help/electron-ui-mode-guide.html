<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Electron UI Guide</title>
  <link rel="stylesheet" href="../artgine/external/legacy/bootstrap-5.3.3-dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="../artgine/external/legacy/bootstrap-icons-1.11.3/bootstrap-icons.css">
  <script src="../artgine/external/legacy/bootstrap-5.3.3-dist/js/bootstrap.min.js"></script>
  <style>
    html,body{height:100%;margin:0;background:#eef1f5}
    .tutorial-app{height:100%;display:grid;grid-template-columns:330px minmax(0,1fr)}
    .guide{background:#fff;border-right:1px solid var(--bs-border-color);display:flex;flex-direction:column;min-height:0}
    .guide-head{padding:18px;border-bottom:1px solid var(--bs-border-color)}
    .guide-head h1{font-size:19px;margin:0 0 6px}.guide-head p{margin:0;color:var(--bs-secondary)}
    .modebar{display:flex;gap:6px;padding:12px;border-bottom:1px solid var(--bs-border-color);background:var(--bs-tertiary-bg)}
    .modebar .btn{flex:1;font-size:13px}
    .steps{padding:12px;overflow:auto;min-height:0;flex:1}
    .step{width:100%;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;text-align:left;border:1px solid var(--bs-border-color);background:#fff;border-radius:.375rem;padding:10px;margin-bottom:8px;cursor:pointer}
    .step.active{background:#e7f1ff;border-color:#9ec5fe}
    .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e9ecef;color:#495057;font-weight:700;font-size:13px}
    .step.active .num{background:var(--bs-blue);color:#fff}.step strong{display:block;margin-bottom:3px}.step span:last-child{font-size:12px;color:var(--bs-secondary)}
    .workspace{height:100%;min-width:0;padding:14px}
    .electron-window{height:100%;min-height:0;background:#fff;border:1px solid var(--bs-border-color);border-radius:.5rem;box-shadow:0 .25rem .75rem rgba(0,0,0,.08);overflow:auto;position:relative}
    .mode-screen{display:none;height:100%;overflow:auto}.mode-screen.active{display:block}
    .server-wrap{max-width:500px}
    .setup-intro{background:#fff;border:1px solid var(--bs-border-color);border-radius:.5rem;padding:16px 18px}
    .setup-flow{position:relative;padding-left:48px}
    .setup-flow:before{content:"";position:absolute;left:17px;top:6px;bottom:6px;width:2px;background:var(--bs-border-color)}
    .setup-item{position:relative;margin-bottom:20px}
    .setup-item:last-child{margin-bottom:0}
    .setup-icon{position:absolute;left:-48px;top:0;width:36px;height:36px;border-radius:50%;background:#fff;border:2px solid var(--bs-blue);color:var(--bs-blue);display:grid;place-items:center;font-size:16px;z-index:1}
    .setup-content{background:#fff;border:1px solid var(--bs-border-color);border-radius:.5rem;padding:14px 16px}
    .setup-content-title{font-weight:700;margin-bottom:8px}
    .source-screen{height:100%;display:flex;flex-direction:column;min-height:0}
    .source-tabs{border-bottom:1px solid var(--bs-border-color);background:var(--bs-tertiary-bg);padding:6px 10px}
    .source-main{min-width:0;min-height:0;flex:1;padding:10px;display:flex;flex-direction:column;gap:8px}
    .fake-qr{width:180px;height:180px;margin:0;border:8px solid #fff;background:#fff;box-shadow:0 0 0 1px var(--bs-border-color);display:grid;grid-template-columns:repeat(13,1fr);grid-template-rows:repeat(13,1fr);gap:2px;padding:8px}
    .fake-qr i{display:block;background:#111}.fake-qr i.blank{background:#fff}
    .fake-qr .finder{grid-column:span 4;grid-row:span 4;border:8px solid #111;background:#fff;position:relative}
    .fake-qr .finder:after{content:"";position:absolute;inset:8px;background:#111}
    .source-legend{display:flex;flex-wrap:wrap;gap:6px;color:var(--bs-secondary);font-size:12px}
    .source-legend span{border:1px solid var(--bs-border-color);border-radius:999px;background:#fff;padding:5px 8px}
    .danger-mark{color:var(--bs-danger);font-weight:800}.ok-mark{color:var(--bs-success);font-weight:800}
    .code{flex:1;margin:0;min-height:0;overflow:auto;background:#1e1e1e;color:#d4d4d4;border-radius:.375rem;padding:14px;font-family:Consolas,monospace;white-space:pre-wrap;line-height:1.55}
    .danger{color:#ff9a9a;background:rgba(220,53,69,.22);border-radius:.25rem;padding:1px 3px}.ok{color:#8df0a8;background:rgba(25,135,84,.24);border-radius:.25rem;padding:1px 3px}.comment{color:#9ca3af}.keyword{color:#8ab4f8}.string{color:#ffd166}
    .coach{position:absolute;right:18px;bottom:18px;width:min(520px,calc(100% - 36px));background:#151b26;color:#fff;border-radius:.5rem;box-shadow:0 .5rem 1rem rgba(0,0,0,.15);padding:16px;z-index:30}
    .coach.collapsed{display:none}
    .coach h2{font-size:18px;margin:0 0 8px;padding-right:24px}.coach p{margin:0 0 12px;color:#d1d5db;line-height:1.45}
    .coach-close{position:absolute;top:10px;right:10px;width:24px;height:24px;border:0;border-radius:50%;background:rgba(255,255,255,.1);color:#fff;line-height:1;font-size:14px;cursor:pointer}
    .coach-close:hover{background:rgba(255,255,255,.2)}
    .tip{border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.08);border-radius:.375rem;padding:9px;color:#e5e7eb;line-height:1.45}
    .coach-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px}.coach-actions .btn{background:#263244;color:#fff;border-color:#4b5563}.coach-actions .btn-primary{background:#0d6efd;border-color:#0d6efd}
    .coach-reopen{display:none;position:absolute;right:18px;bottom:18px;z-index:30;border-radius:999px;padding:.5rem 1rem;background:#0d6efd;color:#fff;border:0;box-shadow:0 .5rem 1rem rgba(0,0,0,.15);cursor:pointer}
    .coach-reopen.show{display:inline-flex;align-items:center;gap:.4rem}
    .highlight{outline:3px solid #f7c948;outline-offset:3px;position:relative;z-index:4}
    .click-tooltip{display:none;position:fixed;z-index:80;max-width:320px;background:#212529;color:#fff;border-radius:.375rem;padding:10px 12px;box-shadow:0 .5rem 1rem rgba(0,0,0,.2);font-size:13px;line-height:1.45}
    .click-tooltip.show{display:block}
    @media(max-width:940px){.tutorial-app{grid-template-columns:1fr;grid-template-rows:1fr}.guide{display:none}.workspace{padding:8px}.coach{right:10px;bottom:10px;width:calc(100% - 20px)}}
  </style>

  <script>
    /* ── i18n ── */
    function applyI18n() {
      document.title = S.pageTitle;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const v = S[el.dataset.i18n];
        if (v !== undefined) el.textContent = v;
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const v = S[el.dataset.i18nHtml];
        if (v !== undefined) el.innerHTML = v;
      });
      $("coachReopenLabel").textContent = S.showCoach;
    }

    const sourceSamples = S.sourceSamples;
    const stepsByMode   = S.stepsByMode;
    const guideTips     = S.guideTips;

    let mode = "setup";
    let current = 0;
    let activeTooltipTarget = null;
    const modeOrder = ["setup", "dev", "server", "source"];
    const $ = id => document.getElementById(id);

    function setMode(nextMode){
      mode = nextMode;
      current = 0;
      document.querySelectorAll("[data-mode]").forEach(btn=>{
        const active = btn.dataset.mode === mode;
        btn.className = "btn " + (active ? "btn-primary" : btn.dataset.mode === "server" ? "btn-outline-success" : "btn-outline-secondary");
      });
      document.querySelectorAll(".mode-screen").forEach(screen=>screen.classList.remove("active"));
      $("screen-" + mode).classList.add("active");
      render();
    }

    function renderSteps(){
      $("steps").innerHTML = stepsByMode[mode].map((step,index)=>
        `<button class="step ${index===current?"active":""}" data-step="${index}" type="button">
          <span class="num">${index+1}</span>
          <span><strong>${step[0]}</strong><span>${step[1]}</span></span>
        </button>`).join("");
      document.querySelectorAll("[data-step]").forEach(btn=>btn.onclick=()=>{current=+btn.dataset.step;render();});
    }

    function showDevTab(buttonId){
      if(!buttonId) return;
      const button = $(buttonId);
      if(!button || !button.dataset.bsTarget) return;
      bootstrap.Tab.getOrCreateInstance(button).show();
    }

    function render(){
      const steps = stepsByMode[mode];
      const step = steps[current];
      renderSteps();
      document.querySelectorAll(".highlight").forEach(el=>el.classList.remove("highlight"));
      if(mode === "dev"){
        const tab = {"pref-tab":"pref-tab","include-tab":"include-tab","manifest-tab":"manifest-tab","plugin-tab":"plugin-tab"}[step[2]] || "app-tab";
        showDevTab(tab);
      }
      if(step[5]) setSource(step[5]);
      $(step[2])?.classList.add("highlight");
      $("coachTitle").textContent = step[0];
      $("coachBody").textContent = step[3];
      $("coachTip").textContent = step[4];
      $("progress").textContent = `${current+1} / ${steps.length}`;
      $("coachNext").textContent = current === steps.length - 1 ? S.done : S.next;
    }

    function setSource(name){
      document.querySelectorAll("[data-source]").forEach(btn=>btn.classList.toggle("active",btn.dataset.source===name));
      $("sourceCode").innerHTML = sourceSamples[name];
    }

    function inferTip(target){
      const explicit = target.closest("[data-guide-tip]");
      if(explicit) return explicit.dataset.guideTip;
      const element = target.closest("button,input,select,textarea,label,.form-check,.card,.alert");
      if(!element) return "";
      const id = element.id || element.getAttribute("for") || element.querySelector("input")?.id;
      if(id && guideTips[id]) return guideTips[id];
      if(element.classList.contains("nav-link")){
        const tabName = element.textContent.trim();
        return guideTips[element.id] || tabName;
      }
      if(element.classList.contains("form-check")){
        const label = element.querySelector("label")?.textContent.trim() || "";
        const inputId = element.querySelector("input")?.id;
        return (inputId && guideTips[inputId]) || label;
      }
      const group = element.closest(".mb-2,.mb-3,.row");
      const label = group?.querySelector(".form-label,.col-form-label")?.textContent.trim();
      if(label) return label;
      if(element.tagName === "BUTTON") return guideTips[element.id] || element.textContent.trim();
      return "";
    }

    function showClickTooltip(target, text){
      const tooltip = $("clickTooltip");
      if(!text){ tooltip.classList.remove("show"); return; }
      if(activeTooltipTarget === target && tooltip.classList.contains("show")){
        tooltip.classList.remove("show");
        activeTooltipTarget = null;
        return;
      }
      activeTooltipTarget = target;
      tooltip.textContent = text;
      tooltip.classList.add("show");
      const rect = target.getBoundingClientRect();
      const margin = 10;
      let left = rect.right + 8;
      if(left + tooltip.offsetWidth > window.innerWidth - margin) left = rect.left - tooltip.offsetWidth - 8;
      if(left < margin) left = margin;
      let top = rect.top;
      if(top + tooltip.offsetHeight > window.innerHeight - margin) top = Math.max(margin, window.innerHeight - tooltip.offsetHeight - margin);
      tooltip.style.left = left + "px";
      tooltip.style.top = top + "px";
    }

    document.querySelectorAll("[data-mode]").forEach(btn=>btn.onclick=()=>setMode(btn.dataset.mode));
    document.querySelectorAll("[data-source]").forEach(btn=>btn.onclick=()=>{
      setSource(btn.dataset.source);
      if(mode==="source"){
        const index = stepsByMode.source.findIndex(step=>step[5]===btn.dataset.source);
        if(index>=0){current=index;render();}
      }
    });
    $("coachNext").onclick=()=>{
      if(current < stepsByMode[mode].length - 1){
        current++;
        render();
        return;
      }
      const nextMode = modeOrder[modeOrder.indexOf(mode) + 1];
      if(nextMode) setMode(nextMode);
      else render();
    };
    document.querySelector(".electron-window").addEventListener("click", event=>{
      const target = event.target.closest("button,input,select,textarea,label,.form-check,.card,.alert");
      if(!target) return;
      const text = inferTip(target);
      if(text) showClickTooltip(target, text);
    });
    document.addEventListener("click", event=>{
      if(!event.target.closest(".electron-window") && !event.target.closest("#clickTooltip")){
        $("clickTooltip").classList.remove("show");
        activeTooltipTarget = null;
      }
    });
    $("clickTooltip").onclick=()=>{
      $("clickTooltip").classList.remove("show");
      activeTooltipTarget = null;
    };
    $("coachClose").onclick=()=>{
      $("coach").classList.add("collapsed");
      $("coachReopen").classList.add("show");
    };
    $("coachReopen").onclick=()=>{
      $("coach").classList.remove("collapsed");
      $("coachReopen").classList.remove("show");
    };

    applyI18n();
    setSource("auto");
    setMode("setup");
  </script>
