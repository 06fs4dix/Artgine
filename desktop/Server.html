<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8" />
		<script src='../artgine/external/legacy/popper/poper.min.js'></script>
	<link rel='stylesheet' href='../artgine/external/legacy/bootstrap-5.3.3-dist/css/bootstrap.min.css'>
	<script src='../artgine/external/legacy/bootstrap-5.3.3-dist/js/bootstrap.min.js'></script>
	<link rel='stylesheet' href='../artgine/external/legacy/bootstrap-icons-1.11.3/bootstrap-icons.css'>
	<script src='../artgine/external/legacy/qrcode.min.js'></script>
	<script type="module" src="Server.js"></script>

	<title>Artgine</title>
</head>

<body>
	<div class="container mt-3"> <!-- 전체 간격 적당히 조정 -->
		<div class="d-flex justify-content-center">
			<div class="w-100" style="max-width: 500px;">
				<div class="row align-items-center mb-2">
					<label class="col-sm-4 col-form-label">URL</label>
					<div class="col-sm-8 d-flex">
						<input type="text" class="form-control me-2" id="url_txt" readonly>
						<button class="btn btn-outline-secondary" id="url_btn">Copy</button>
					</div>
				</div>
				<div class="mb-3 row align-items-center">
					<label class="col-sm-4 col-form-label">Private IP</label>
					<div class="col-sm-8 d-flex">
						<input type="text" class="form-control me-2" id="privateIP_txt" readonly>
						<button class="btn btn-outline-secondary" id="privateIP_btn">Copy</button>
					</div>
				</div>
				<div class="mb-3 row align-items-center">
					<label class="col-sm-4 col-form-label">Public IP</label>
					<div class="col-sm-8 d-flex">
						<input type="text" class="form-control me-2" id="publicIP_txt" readonly>
						<button class="btn btn-outline-secondary" id="publicIP_btn">Copy</button>
					</div>
				</div>
				<div class="accordion mb-3" id="authRootAccordion">
					<div class="accordion-item">
						<h2 class="accordion-header">
							<button class="accordion-button collapsed py-2" type="button" data-bs-toggle="collapse" data-bs-target="#authRoot_collapse">
								Extra Server Settings
							</button>
						</h2>
						<div id="authRoot_collapse" class="accordion-collapse collapse" data-bs-parent="#authRootAccordion">
							<div class="accordion-body py-2">
								<div class="mb-2">
									<label class="form-label">Password</label>
									<input type="password" class="form-control" id="auth_password_txt">
								</div>
							</div>
						</div>
					</div>
				</div>
				<div class="text-center d-flex justify-content-center gap-2">
					<button class="btn btn-primary" id="browser_btn" disabled>Browser</button>
					<button class="btn btn-secondary" id="switchDev_btn">Developer</button>
				</div>
				<div class="text-center mt-3" id="qr_area" style="display:none;">
					<img id="qr_img" width="180" height="180">
				</div>
			</div>
		</div>
	</div>
</body>
